<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{height:100%;background:#0a0a0a;color:#f0f0f0;font-family:-apple-system,system-ui,sans-serif;overflow:hidden;}
:root{
  --bg:#050505;--card:#111;--card2:#161616;--faint:#1c1c1c;--border:#242424;
  --accent:#e8ff47;--teal:#3de8d0;--orange:#ff5c1a;--purple:#b06dff;
  --green:#3de88a;--pink:#f472b6;--sky:#38d9ff;--text:#f0f0f0;--muted:#555;
}
.app{display:flex;flex-direction:column;height:100vh;height:100svh;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px;min-height:0;}
.screen{display:none;}.screen.active{display:block;}
.hdr{background:#080808;border-bottom:1px solid var(--border);padding:12px 16px 10px;position:sticky;top:0;z-index:40;}
.hdr-row{display:flex;justify-content:space-between;align-items:center;}
.hdr-day{font-size:22px;font-weight:900;letter-spacing:0.02em;}
.hdr-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.hdr-badge{font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;}
.day-strip{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);background:var(--card);}
.day-strip::-webkit-scrollbar{display:none;}
.day-pill{flex-shrink:0;min-width:52px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);cursor:pointer;text-align:center;transition:all 0.15s;}
.dp-name{font-size:11px;font-weight:700;font-family:monospace;color:var(--muted);}
.dp-dot{width:5px;height:5px;border-radius:50%;background:var(--border);margin:4px auto 0;}
.proto-banner{padding:10px 16px;font-size:11px;color:#888;font-family:monospace;border-bottom:1px solid var(--border);background:var(--bg);line-height:1.7;}
.proto-banner b{color:var(--accent);}
.ex-list{padding:10px 16px 20px;}
.block-hdr{font-size:9px;font-family:monospace;letter-spacing:0.18em;margin:22px 0 8px;display:flex;align-items:center;gap:10px;font-weight:700;}
.block-hdr::after{content:'';flex:1;height:1px;background:var(--border);}
.block-hdr:first-child{margin-top:6px;}
.ex-card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;overflow:hidden;transition:border-color 0.15s;}
.ex-card:active{border-color:var(--border);}
.ex-card.done{border-color:rgba(232,255,71,0.25);background:#131309;}
.ex-row{display:flex;align-items:center;gap:12px;padding:14px;min-height:64px;cursor:pointer;}
.ex-tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--faint);}
.ex-card.done .ex-tick{background:var(--accent);border-color:var(--accent);color:#000;}
.ex-mid{flex:1;min-width:0;}
.ex-name{font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-0.01em;}
.ex-meta{font-size:11px;color:var(--muted);margin-top:3px;font-family:monospace;letter-spacing:0.02em;}
.ex-best{font-size:11px;color:var(--teal);margin-top:2px;font-family:monospace;}
.ex-qual{font-size:11px;color:var(--purple);margin-top:2px;font-family:monospace;}
.ex-chev{font-size:18px;color:var(--muted);flex-shrink:0;transition:transform 0.2s;}
.ex-card.open .ex-chev{transform:rotate(180deg);}
.ex-body{display:none;border-top:1px solid var(--border);}
.ex-card.open .ex-body{display:block;}
.tag{display:inline-block;font-size:8px;padding:1px 6px;border-radius:3px;font-family:monospace;margin-left:5px;vertical-align:middle;letter-spacing:0.05em;}
.howto{padding:14px 16px;background:#0a0a0a;border-bottom:1px solid var(--border);}
.howto-lbl{font-size:9px;color:var(--accent);font-family:monospace;letter-spacing:0.12em;margin-bottom:10px;}
.howto-txt{font-size:13px;color:#aaa;line-height:1.85;}
.howto-txt b{color:var(--accent);font-weight:600;}
.rest-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0e0e0e;border-top:1px solid var(--border);}
.rest-info{display:flex;flex-direction:column;gap:2px;}
.rest-lbl{font-size:9px;color:var(--muted);font-family:monospace;letter-spacing:0.1em;}
.rest-val{font-size:16px;font-weight:700;color:var(--accent);font-family:monospace;}
.rest-btn{padding:10px 20px;background:var(--accent);color:#000;border:none;border-radius:8px;font-weight:700;font-size:13px;font-family:monospace;cursor:pointer;}
.sets-area{padding:14px 16px;border-top:1px solid var(--border);}
.sets-lbl{font-size:9px;color:var(--muted);font-family:monospace;letter-spacing:0.1em;margin-bottom:10px;}
.set-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.set-n{font-size:12px;color:var(--muted);font-family:monospace;width:16px;flex-shrink:0;}
.i-kg{flex:1;background:var(--faint);border:1.5px solid var(--border);color:var(--text);padding:12px 8px;font-size:18px;font-family:monospace;font-weight:700;border-radius:8px;text-align:center;-webkit-appearance:none;}
.i-kg:focus{outline:none;border-color:var(--accent);}
.i-rp{width:68px;background:var(--faint);border:1.5px solid var(--border);color:var(--text);padding:12px 8px;font-size:18px;font-family:monospace;font-weight:700;border-radius:8px;text-align:center;-webkit-appearance:none;}
.i-rp:focus{outline:none;border-color:var(--teal);}
.i-unit{font-size:11px;color:var(--muted);flex-shrink:0;}
.del-btn{width:32px;height:44px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}
.add-set{width:100%;padding:12px;background:none;border:1.5px dashed var(--border);color:var(--muted);border-radius:8px;cursor:pointer;font-family:monospace;font-size:13px;margin-top:4px;}
.save-btn{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:10px;cursor:pointer;font-family:monospace;font-size:14px;font-weight:700;margin-top:10px;letter-spacing:0.05em;}
.save-btn:active{opacity:0.85;}
.pr-msg{display:none;padding:10px;background:rgba(232,255,71,0.08);border:1px solid rgba(232,255,71,0.2);border-radius:8px;text-align:center;font-size:13px;color:var(--accent);font-family:monospace;margin-top:8px;}
.qual-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;background:var(--faint);border-radius:8px;}
.qual-lbl{font-size:11px;color:var(--muted);font-family:monospace;flex:1;}
.qual-btns{display:flex;gap:4px;}
.q-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:monospace;}
.q-btn.sel{background:var(--purple);border-color:var(--purple);color:#000;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#080808;border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;padding:10px 4px 8px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:9px;font-family:monospace;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nav-btn.active{color:var(--accent);}
.nav-btn .ni{font-size:21px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:100;align-items:flex-end;}
.overlay.open{display:flex;}
.modal{background:#111;border-radius:20px 20px 0 0;padding:24px 20px calc(34px + env(safe-area-inset-bottom));width:100%;text-align:center;border-top:1px solid var(--border);}
.m-lbl{font-size:10px;color:var(--muted);font-family:monospace;letter-spacing:0.15em;margin-bottom:10px;}
.m-time{font-size:70px;font-weight:900;font-family:monospace;color:var(--accent);line-height:1;}
.m-bar-w{height:5px;background:var(--border);border-radius:3px;margin:18px 0;}
.m-bar{height:5px;background:var(--accent);border-radius:3px;transition:width 1s linear;}
.m-done{color:var(--green);font-size:22px;margin-top:6px;display:none;}
.m-close{width:100%;padding:14px;background:var(--faint);color:var(--muted);border:1px solid var(--border);border-radius:12px;cursor:pointer;font-family:monospace;font-size:14px;margin-top:8px;}
.week-list{padding:12px 16px;}
.w-item{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;}
.w-day{font-size:13px;font-weight:900;font-family:monospace;width:36px;flex-shrink:0;}
.w-info{flex:1;}
.w-full{font-size:16px;font-weight:700;}
.w-focus{font-size:12px;color:var(--muted);margin-top:2px;}
.w-local{font-size:10px;font-family:monospace;margin-top:4px;}
.hist-list{padding:12px 16px;}
.h-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.h-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.h-name{font-size:14px;font-weight:600;}
.h-date{font-size:10px;color:var(--muted);font-family:monospace;}
.h-sets{font-size:12px;color:var(--muted);font-family:monospace;line-height:1.8;}
.h-best{font-size:12px;color:var(--teal);font-family:monospace;margin-top:3px;}
.h-qual{font-size:11px;color:var(--purple);font-family:monospace;margin-top:2px;}
.review-screen{padding:16px;}
.review-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.review-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;}
.review-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.review-item:last-child{border-bottom:none;}
.review-label{font-size:12px;color:var(--muted);}
.review-val{font-size:12px;color:var(--accent);font-family:monospace;font-weight:700;}
.review-textarea{width:100%;background:var(--faint);border:1px solid var(--border);color:var(--text);padding:12px;font-size:13px;border-radius:8px;margin-top:8px;min-height:80px;font-family:-apple-system,system-ui,sans-serif;resize:none;}
.review-textarea:focus{outline:none;border-color:var(--accent);}
.review-save{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:10px;cursor:pointer;font-family:monospace;font-size:14px;font-weight:700;margin-top:12px;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty .ei{font-size:44px;margin-bottom:10px;}
.section-sep{height:1px;background:var(--border);margin:20px 0 4px;}
.load-box{padding:14px 16px;background:#090909;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.load-box-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.load-lbl{font-size:9px;color:var(--muted);font-family:monospace;letter-spacing:0.12em;margin-bottom:4px;}
.load-rm-row{display:flex;align-items:center;gap:8px;}
.rm-input{width:72px;background:var(--faint);border:1.5px solid var(--border);color:var(--text);padding:8px 8px;font-size:15px;font-family:monospace;font-weight:700;border-radius:8px;text-align:center;-webkit-appearance:none;}
.rm-input:focus{outline:none;border-color:var(--teal);}
.rm-save{padding:8px 14px;background:var(--teal);color:#000;border:none;border-radius:8px;font-family:monospace;font-size:12px;font-weight:700;cursor:pointer;}
.week-selector{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#0d0d0d;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.week-selector::-webkit-scrollbar{display:none;}
.week-lbl{font-size:9px;color:var(--muted);font-family:monospace;white-space:nowrap;letter-spacing:0.1em;flex-shrink:0;}
.wk-btn{flex-shrink:0;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--faint);color:var(--muted);font-size:10px;font-family:monospace;cursor:pointer;white-space:nowrap;}
.time-bar{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;background:var(--bg);border-bottom:1px solid var(--border);}
.time-start{font-size:14px;font-weight:700;color:var(--accent);font-family:monospace;}
.time-end{font-size:11px;color:var(--muted);font-family:monospace;margin-top:1px;}
.time-total{font-size:12px;color:var(--teal);font-family:monospace;font-weight:700;background:rgba(61,232,208,0.08);padding:4px 10px;border-radius:6px;border:1px solid rgba(61,232,208,0.2);}
.ex-time{font-size:10px;color:#444;font-family:monospace;margin-top:2px;}
/* ── SKILLS ── */
.skills-wrap{padding:12px 16px 20px;}
.skill-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.skill-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.skill-name{font-size:18px;font-weight:900;color:var(--text);letter-spacing:0.02em;}
.skill-phase-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:6px;font-family:monospace;}
.skill-desc{font-size:11px;color:var(--muted);font-family:monospace;margin-bottom:10px;}
.skill-bar-wrap{height:4px;background:var(--border);border-radius:2px;margin-bottom:6px;}
.skill-bar{height:4px;border-radius:2px;transition:width 0.5s ease;}
.skill-pct-row{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-family:monospace;margin-bottom:10px;}
.skill-phases{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.sp{font-size:10px;padding:4px 8px;border-radius:5px;font-family:monospace;border:1px solid var(--border);color:var(--muted);background:var(--faint);}
.sp.done{font-weight:700;color:#000;}.sp.cur{font-weight:700;border-width:1.5px;}
.skill-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.si-lbl{font-size:9px;color:var(--muted);font-family:monospace;letter-spacing:0.08em;margin-bottom:4px;}
.si-inp{width:100%;background:var(--faint);border:1.5px solid var(--border);color:var(--text);padding:10px 8px;font-size:18px;font-family:monospace;font-weight:700;border-radius:8px;text-align:center;-webkit-appearance:none;}
.si-inp:focus{outline:none;border-color:var(--accent);}
.si-sel{width:100%;background:var(--faint);border:1.5px solid var(--border);color:var(--text);padding:10px 8px;font-size:13px;font-family:monospace;border-radius:8px;-webkit-appearance:none;appearance:none;}
.skill-save{width:100%;padding:12px;border:none;border-radius:9px;cursor:pointer;font-family:monospace;font-size:13px;font-weight:700;color:#000;}
.skill-hist{font-size:11px;color:var(--muted);font-family:monospace;margin-top:6px;text-align:center;}
/* ── CALENDAR ── */
.cal-wrap{padding:12px 16px 20px;}
.cal-streak-row{display:flex;gap:10px;margin-bottom:14px;}
.cal-streak-card{flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center;}
.csc-num{font-size:32px;font-weight:900;color:var(--accent);line-height:1;font-family:monospace;}
.csc-lbl{font-size:9px;color:var(--muted);font-family:monospace;margin-top:3px;letter-spacing:0.08em;}
.cal-month-lbl{font-size:18px;font-weight:900;margin-bottom:10px;letter-spacing:0.02em;}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.cal-nav-btn{background:var(--faint);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:7px;font-size:18px;cursor:pointer;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow{font-size:9px;color:var(--muted);font-family:monospace;text-align:center;padding:4px 0;}
.cal-day{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-family:monospace;color:var(--muted);background:var(--card);border:1px solid var(--border);cursor:pointer;}
.cal-day.today{border-color:var(--accent);color:var(--accent);font-weight:700;}
.cal-day.done{background:var(--accent);color:#000;font-weight:700;border-color:var(--accent);}
.cal-day.partial{background:rgba(232,255,71,0.15);border-color:rgba(232,255,71,0.35);color:var(--accent);}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default;}

 {t:"ATIVAÇÃO + PROPRIOCEPÇÃO",ex:[
  {id:"singleg-bal",name:"Single Leg Balance — Olhos Fechados",sets:"3×20–30s/lado",rest:20,tag:"prop",
   how:"<b>Em pé. Uma perna no chão. Olhos fechados.</b><br><br> 1. Levanta levemente uma perna do chão<br> 2. Fecha os olhos<br> 3. Foca em sentir o tornozelo fazendo micro-ajustes<br> 4. Mantém pelo tempo prescrito. Troca de perna.<br><br> <b>Progressão semanal:</b><br> Sem 1–2: 10–15s, olhos abertos<br> Sem 3–5: 20–25s, olhos fechados<br> Sem 6–8: 30s, olhos fechados<br> Sem 9+: 30s, olhos fechados, superfície instável (almofada dobrada)<br><br> <b>Dica técnica:</b> pressionar o dedão no chão e os 4 pontos do pé ativa os músculos intrínsecos e ajuda o equilíbrio.<br><br> <b>Métrica de evolução:</b> tempo máximo de hold sem perder o equilíbrio. Registra na aba SKILLS todo domingo."},
  {id:"serratil-pu",name:"Serrátil Push-Up",sets:"3×12",rest:30,
   how:"<b>Flexão de braço com protração máxima no topo.</b><br><br> 1. Prancha alta, mãos na largura dos ombros<br> 2. Desce normalmente até o peito quase tocar o chão<br> 3. Sobe até os braços estendidos<br> 4. No topo: continua empurrando — as omoplatas se afastam da coluna e o tronco sobe mais 2–3cm<br> 5. Segura a protração máxima 1s<br> 6. Retorna<br><br> <b>O que sentir:</b> uma sensação de 'enrolar' as omoplatas para frente e para cima no topo. Se não sente, empurra mais.<br><br> <b>Métrica de evolução:</b> a qualidade da protração. No início parece 'pouco' movimento. Com semanas, a diferença entre a posição normal e a protração máxima aumenta — isso indica que o serrátil está sendo ativado corretamente."},
  {id:"planche-lean",name:"Planche Lean",sets:"4×20–30s",rest:45,
   how:"<b>Prancha alta inclinada — posição base do planche.</b><br><br> 1. Prancha alta, mãos na largura dos ombros, dedos levemente para fora<br> 2. Deprime as escápulas MÁXIMO (ombros longe das orelhas)<br> 3. Protrui as escápulas MÁXIMO (omoplatas se afastam da coluna)<br> 4. Inclina o corpo inteiro para frente — os ombros passam além das mãos<br> 5. Mantém o corpo completamente rígido — não dobra quadril nem joelhos<br><br> <b>Quanto inclinar:</b><br> Sem 1–4: ombros ~5–10° além das mãos<br> Sem 5–8: ombros ~15° além<br> Sem 9+: ombros ~20–25° além<br><br> <b>Métrica de evolução:</b> ângulo de inclinação medido com régua ou estimado por foto de lado. Marca o ângulo a cada 4 semanas."},
  {id:"copenhagen",name:"Copenhagen Plank",sets:"3×20–30s/lado",rest:30,tag:"sa",
   how:"Deita de lado. Apoia o tornozelo interno da perna de cima em um banco ou step. Eleva o corpo em prancha lateral — apenas o tornozelo e o antebraço tocam. A perna de baixo fica no ar ou apoia levemente. Core anti-lateral máximo — o que mantém o corpo rígido no planche e no front lever. Progressão: semana 1: 10s. Semana 4: 30s. Semana 8: Copenhagen com movimento de adução da perna de baixo.<br><br><b>Métrica de evolução:</b> tempo de hold por lado. Semana 1: 10–15s. Semana 4: 30s. Semana 8: 45s. Quando 3×45s limpas → adiciona movimento de adução da perna de baixo."},
 ]},
 {t:"SKILL — PLANCHE [STRAIGHT ARM]",ex:[
  {id:"scap-clock",name:"Scapular Clock no Hang",sets:"2×6/posição",rest:20,tag:"sa",
   how:"<b>Pendurado na barra — controle total das escápulas.</b><br><br> Braços COMPLETAMENTE estendidos durante todo o exercício. Move as escápulas para cada posição e segura 3s:<br><br> • <b>12h</b> — eleva os ombros em direção às orelhas (shrug). Sente os trapézios superiores.<br> • <b>3h</b> — retrai as escápulas, aproximando-as da coluna. Sente os romboides.<br> • <b>6h</b> — desce os ombros o máximo possível, longe das orelhas. Sente os serráteis e trapézios inferiores.<br> • <b>9h</b> — protrui as escápulas, afastando-as da coluna. Sente os serráteis.<br> • <b>Combinação</b> — depressão + protração simultâneas (posição base do planche). 5s.<br><br> <b>Métrica de evolução:</b> amplitude de movimento em cada posição. Com semanas, a diferença entre 12h e 6h aumenta visivelmente."},
  {id:"tuck-planche",name:"Tuck Planche Hold",sets:"5×10–20s",rest:90,tag:"sa",
   how:"<b>O skill principal — construção progressiva do planche.</b><br><br> <b>Posição:</b><br> 1. Mãos no chão, dedos levemente para fora<br> 2. Braços completamente estendidos<br> 3. Escápulas em MÁXIMA depressão + MÁXIMA protração simultaneamente<br> 4. Empurra os braços para trás (como se tentasse mover as mãos para atrás sem elas se moverem)<br> 5. Quadril ACIMA dos ombros — não no nível<br> 6. Joelhos no peito, costas arredondadas<br><br> <b>O que sentir:</b> tensão máxima nos ombros, serráteis e trapézios inferiores. Os braços tremem — normal.<br><br> <b>Critério de progressão:</b><br> Tuck → Advanced Tuck: 5×20s limpos em 3 sessões consecutivas<br> Advanced Tuck → Straddle: 5×20s limpos em 3 sessões consecutivas<br><br> <b>Métrica de evolução:</b> hold máximo por série. Registra toda sessão. Deve subir 2–3s por semana no início."},
  {id:"planche-neg",name:"Planche Push-Up — Negativas [3-0-X]",sets:"4×4–6",rest:120,tag:"tempo",
   how:"<b>Negativa do Planche Push-Up — TEMPO 3-0-X.</b><br><br> 1. Começa no Tuck Planche (mãos no chão, braços estendidos, joelhos no peito, quadril elevado)<br> 2. Mantendo TODA a posição (quadril elevado, escápulas deprimidas+protruídas, joelhos no peito), desce em <b>3 segundos contados</b><br> 3. O peito quase toca o chão no fundo<br> 4. Sobe de qualquer forma de volta ao Tuck Planche<br><br> <b>Erro comum:</b> o quadril cai durante a descida. Se isso acontecer, a série acabou para aquele round.<br><br> <b>Métrica de evolução:</b> número de reps limpas por série. Deve crescer de 4→6 ao longo das semanas."},
  {id:"pseudo-pu",name:"Pseudo Planche Push-Up [3-1-X]",sets:"3×8–12",rest:90,tag:"tempo",
   how:"<b>Pseudo Planche Push-Up — TEMPO 3-1-X.</b><br><br> <b>Setup:</b> prancha alta com as mãos VIRADAS PARA TRÁS — dedos apontam para os pés (ou ~45° para os lados no início).<br><br> 1. Máxima depressão + protração das escápulas — como no planche lean<br> 2. Desce em <b>3 segundos</b><br> 3. Pausa <b>1 segundo</b> no fundo sem relaxar — máxima tensão<br> 4. Sobe explosivo<br><br> <b>Progressão do ângulo das mãos:</b><br> Sem 1–4: mãos a 45° para fora<br> Sem 5–8: mãos a 90° (perpendiculares ao corpo)<br> Sem 9+: mãos apontando para os pés<br><br> <b>Métrica de evolução:</b> ângulo das mãos + número de reps limpas por série."},
  {id:"planche-iso",name:"Planche Lean — Overcoming Isometric",sets:"3×8s",rest:60,tag:"iso",
   how:"<b>Overcoming Isometric — quebra platôs do planche.</b><br><br> 1. Vai para a posição de Planche Lean no ângulo onde o planche começa a falhar (ombros ~10–15° além das mãos)<br> 2. Empurra o chão para BAIXO com força MÁXIMA por 8 segundos — como se tentasse afundar as mãos no chão<br> 3. O corpo não se move. A intenção é 100%.<br> 4. Descansa 60s. Repete.<br><br> <b>Por que funciona:</b> treina força máxima especificamente no ponto mais fraco. 3×8s aqui > 10 séries de planche lean normal para ganho de força no ângulo crítico.<br><br> <b>Métrica de evolução:</b> percepção de esforço no ângulo trabalhado. Progressão acontece quando o mesmo ângulo começa a parecer mais fácil (em 3–4 semanas)."},
  {id:"side-plank-rot",name:"Side Plank com Rotação",sets:"3×8/lado",rest:45,tag:"sa",
   how:"<b>Side Plank com Rotação Torácica — core + mobilidade.</b><br><br> 1. Side plank: antebraço no chão, pés empilhados ou escalonados. Corpo em linha reta.<br> 2. Abre o braço livre lentamente em direção ao teto — rotação vem da TORÁCICA, não do quadril<br> 3. Passa o braço por baixo do corpo o máximo possível<br> 4. Retorna ao teto. Isso é 1 rep.<br><br> <b>O quadril não cai e não rotaciona</b> — só o tronco superior se move.<br><br> <b>Métrica de evolução:</b> amplitude de rotação (ângulo do braço livre). Com semanas, consegue passar o braço mais longe por baixo."},
 ]},
 {t:"FORÇA — SUPINO + POTÊNCIA UPPER",ex:[
  {id:"med-throw",name:"Medicine Ball Chest Throw",sets:"4×6",rest:60,tag:"plyU",
   how:"<b>Medicine Ball Chest Throw — potência explosiva de upper body.</b><br><br> Com MB de 3–5kg. Em pé a ~1m da parede.<br><br> 1. Segura a MB com as duas mãos na altura do peito<br> 2. Rápido contramovimento: puxa a MB para o peito<br> 3. Joga EXPLOSIVO contra a parede — máxima velocidade de saída<br> 4. Pega a MB e repete<br><br> <b>Ênfase:</b> velocidade máxima, não força sustentada. Cada rep é 100% de potência.<br><br> <b>Sem MB:</b> faz explosive push-up com palma, tentando bater palma.<br><br> <b>Métrica de evolução:</b> velocidade subjetiva de saída e som do impacto na parede. Deve ficar mais alto e mais seco com semanas."},
  {id:"supino",name:"Supino Reto com Barra [2-1-X]",sets:"5×3–5",rest:240,tag:"tempo",
   how:"<b>Supino Reto — TEMPO 2-1-X.</b><br><br> <b>Setup:</b><br> • Deita no banco. Escápulas retraídas e deprimidas (peito para cima, ombros para baixo)<br> • Pés no chão ou no banco — estáveis<br> • Pegada: um pouco mais larga que os ombros. Polegar em volta da barra.<br><br> <b>Execução:</b><br> 1. Inspira fundo e faz Valsalva (segura o ar, contrai o core)<br> 2. Desce a barra em <b>2 segundos</b> até tocar o peito na linha dos mamilos<br> 3. Pausa <b>1 segundo</b> com a barra no peito — elimina o bounce<br> 4. Sobe explosivo. Expira.<br><br> <b>Cotovelos:</b> ~60° do corpo — nem perpendiculares nem colados.<br><br> <b>Métrica de evolução:</b> 1RM calculado pelo app. Deve subir 2.5kg a cada 2–3 semanas no início."},
  {id:"supino-inc",name:"Supino Inclinado Halteres [3-0-X]",sets:"3×8–10",rest:120,tag:"tempo",
   how:"<b>Supino Inclinado com Halteres — TEMPO 3-0-X.</b><br><br> Banco a 30–45°. Halteres nas mãos.<br><br> 1. Posição inicial: halteres na altura do peito, cotovelos levemente abaixo dos ombros<br> 2. Desce em <b>3 segundos</b> — cotovelos descem abaixo do nível do banco na posição mais baixa<br> 3. Sem pausa — sobe explosivo<br> 4. Os halteres não se tocam no topo (mantém tensão)<br><br> <b>Foco:</b> cabeça clavicular do peitoral (porção superior-interna). Ângulo de banco maior que 45° perde o foco para o deltóide.<br><br> <b>Métrica de evolução:</b> peso dos halteres. Deve progredir 2.5kg a cada 2–3 semanas."},
  {id:"ohp",name:"Desenvolvimento Militar [2-1-X]",sets:"3×6–8",rest:90,tag:"tempo",
   how:"<b>Desenvolvimento Militar — TEMPO 2-1-X.</b><br><br> Em pé. Pés na largura dos ombros.<br><br> 1. Barra na clavícula, pegada levemente mais larga que os ombros<br> 2. Contrai core e glúteos — não deixa a lombar hiperextender<br> 3. Desce em <b>2 segundos</b> até a barra tocar a clavícula<br> 4. Pausa <b>1 segundo</b> na clavícula<br> 5. Empurra explosivo — cabeça inclina levemente para trás quando a barra passa, depois volta<br> 6. Shrug ativo no lockout (ombros sobem levemente no topo)<br><br> <b>Sem impulso de joelhos</b> — se precisar, reduza a carga.<br><br> <b>Métrica de evolução:</b> 1RM. Progride mais devagar que o supino — normal. +1.25kg a cada 2 semanas é excelente."},
  {id:"face-pull",name:"Face Pull",sets:"3×15–20",rest:45,
   how:"<b>Face Pull — prevenção obrigatória de ombro.</b><br><br> Cabo ou elástico na altura dos olhos.<br><br> 1. Segura a corda com ambas as mãos, palmas para dentro<br> 2. Puxa em direção ao rosto, separando as mãos conforme puxa — os punhos ficam nas têmporas no final<br> 3. Cotovelos terminam na altura dos ombros ou acima, apontando para os lados<br> 4. Ombros rodam externamente no topo — sente o ombro girar para fora<br> 5. Pausa 1s. Retorna controlado.<br><br> <b>Por que é obrigatório:</b> o volume de pressing (supino + OHP + HSPU) desequilibra o ombro para frente. 3×15 de face pull por sessão de pressing é o mínimo preventivo.<br><br> <b>Métrica de evolução:</b> sensação de ombro saudável. Se começar a sentir dor de ombro → aumenta para 4 séries."},
  {id:"rc-er",name:"Rotação Externa Resistida — Manguito",sets:"3×15/lado",rest:30,tag:"rc",
   how:"<b>Rotação Externa — fortalecimento do manguito rotador.</b><br><br> Deitado de lado. Braço de trabalho com cotovelo dobrado a 90°, colado ao corpo.<br><br> 1. Com halter leve (2–5kg) ou elástico<br> 2. Rotaciona o antebraço para CIMA até ficar vertical — o cotovelo permanece colado ao corpo<br> 3. Desce controlado em 2s<br><br> <b>Peso certo:</b> não muito pesado. O objetivo é coordenação e fortalecimento preventivo do infra-espinhoso e redondo menor — músculos pequenos.<br><br> <b>Métrica de evolução:</b> aumento progressivo de carga (0.5–1kg a cada 4–6 semanas) E ausência de dor de ombro ao longo do programa."},
 ]},
 {t:"FUNCIONAL",ex:[
  {id:"tgu",name:"Turkish Get-Up [sem tempo]",sets:"3×3/lado",rest:90,
   how:"<b>Turkish Get-Up — 7 fases. Pausa 1s em cada.</b><br><br> Com KB ou halter em uma mão, SEMPRE estendido para o teto:<br><br> <b>1. Deitado</b> — braço estendido para o teto. Joelho ipsilateral dobrado.<br> <b>2. Cotovelo</b> — apoia no cotovelo do braço oposto.<br> <b>3. Mão</b> — estende o braço oposto, mão no chão.<br> <b>4. Quadril elevado</b> — empurra quadril para cima saindo completamente do chão.<br> <b>5. Lunge</b> — passa a perna de baixo por baixo do corpo em lunge. Joelho no chão.<br> <b>6. Em pé</b> — levanta do lunge.<br> <b>7. Une os pés</b> — posição final em pé.<br><br> Desce pela sequência INVERSA com a mesma qualidade.<br><br> <b>Olhos SEMPRE no KB</b> — perder o foco é o primeiro sinal de colapso de forma.<br><br> <b>Métrica de evolução:</b> peso do KB. Começa com 16kg, progride para 24kg, 32kg."},
  {id:"grip-pinch",name:"Pinch Grip + Extensão de Dedos",sets:"3×20s",rest:30,tag:"grip",
   how:"<b>Dois exercícios em sequência:</b><br><br><b>Pinch Grip (20s por mão):</b><br>Segura uma anilha (5–10kg) entre o polegar e os dedos (não dobrados — dedos estendidos pressionando de um lado, polegar do outro). Mantém 20s. Trabalha os músculos que o grip normal não atinge.<br><br><b>Extensão de Dedos (15 reps):</b><br>Coloca um elástico em volta de todos os dedos de uma mão. Abre a mão contra a resistência — dedos se abrem. 15× rápidos. Equilibra a força de fechamento com a de abertura. Previne tendinite.<br><br><b>Métrica de evolução:</b> peso da anilha no pinch grip. Começa com 5–10kg. Progride 2.5kg quando 3×20s ficarem confortáveis. Registra o peso a cada semana."},
  {id:"finger-mob",name:"Mobilidade de Dedos e Mãos",sets:"2×8/dedo",rest:20,tag:"grip",
   how:"<b>3 movimentos por mão:</b><br><br>1. <b>Extensão passiva:</b> com a outra mão, puxa cada dedo suavemente para trás — 5s por dedo. Sente o alongamento na palma.<br>2. <b>Flexão de metacarpos:</b> dobra os dedos no meio (segunda articulação), mas mantém as pontas retas. Como fazer um 'gancho'.<br>3. <b>CARs de pulso:</b> rotação completa e controlada do pulso — devagar, sentindo cada ponto da amplitude. 5 rotações para cada lado.<br><br><b>Métrica de evolução:</b> amplitude de extensão passiva de cada dedo (ângulo em relação à palma). Ausência de dor nos pulsos durante OAC e Front Lever ao longo do programa."},
 ]},
 {t:"MOBILIDADE — OMBRO + TORÁCICA",ex:[
  {id:"german-hang",name:"German Hang / Skin the Cat",sets:"3×15–30s",rest:60,tag:"mob",
   how:"<b>German Hang / Skin the Cat — mobilidade de ombro em rotação interna.</b><br><br> <b>Nas argolas (preferível) ou barra:</b><br><br> 1. Pendurado. Traz joelhos ao peito.<br> 2. Passa os pés ENTRE os braços, levando as pernas para trás<br> 3. Para no ponto de tensão confortável — sente o alongamento profundo na parte anterior do ombro<br> 4. Mantém o tempo prescrito<br> 5. Volta pela mesma rota<br><br> <b>Progressão:</b><br> Sem 1–4: angulo parcial — para antes de sentir dor<br> Sem 5–8: German hang com joelhos dobrados<br> Sem 9+: German hang com pernas estendidas<br><br> <b>Métrica de evolução:</b> ângulo atingido + tempo de hold."},
  {id:"thor-rot",name:"Thread the Needle",sets:"3×8/lado",rest:30,tag:"thor",
   how:"<b>Thread the Needle — mobilidade torácica rotacional.</b><br><br> Em quatro apoios.<br><br> 1. Eleva o braço direito para o lado<br> 2. Passa o braço direito por baixo do espaço entre o braço esquerdo e o torso<br> 3. O ombro direito toca o chão. Cabeça vai junto.<br> 4. Mantém 3s no máximo de rotação<br> 5. Retorna. Repete. Troca de lado.<br><br> <b>O quadril fica imóvel</b> — só a torácica rotaciona.<br><br> <b>Métrica de evolução:</b> amplitude de rotação — quanto o ombro se aproxima do chão."},
  {id:"thor-ext",name:"Extensão Torácica com Rolo [PAILs/RAILs]",sets:"3×60s",rest:30,tag:"pails",
   how:"<b>Extensão Torácica + PAILs/RAILs — 3 posições da torácica.</b><br><br> Rolo perpendicular à espinha na altura torácica (abaixo das escápulas).<br><br> <b>Por posição (60s passivo + PAILs 10s + RAILs 10s):</b><br> • <b>Passivo:</b> deita com o rolo nessa posição. Braços cruzados ou acima da cabeça. Gravidade trabalha.<br> • <b>PAILs:</b> empurra as costas CONTRA o rolo com força máxima por 10s. Não move.<br> • <b>RAILs:</b> tenta estender o peito ALÉM do ponto passivo por 10s.<br><br> Move o rolo para 3 posições diferentes (inferior → médio → superior da torácica).<br><br> <b>Métrica de evolução:</b> amplitude de extensão + progressão para posições mais superiores da torácica."},
  {id:"shoulder-flex",name:"Shoulder Flexion — PAILs/RAILs",sets:"3×60s",rest:30,tag:"pails",
   how:"<b>Shoulder Flexion + PAILs/RAILs — no hang.</b><br><br> <b>Passivo (60s):</b> hang normal. O peso do corpo cria tração gradual. Os ombros abrem progressivamente.<br><br> <b>PAILs (10s):</b> empurra os braços PARA BAIXO contra a barra com força máxima. Tensiona o latíssimo e depressores.<br><br> <b>RAILs (10s):</b> tenta elevar os braços AINDA MAIS alto. Tensiona os flexores do ombro no comprimento longo.<br><br> <b>Por que supera o hang passivo sozinho:</b> os RAILs treinam a capacidade ATIVA na nova amplitude — o que permite que o ganho seja permanente e utilizável.<br><br> <b>Métrica de evolução:</b> ângulo dos ombros no passivo (foto de lado, compare mensalmente)."},
  {id:"bridge",name:"Bridge Progressivo [2-0-2]",sets:"3×30–60s",rest:60,tag:"tempo",
   how:"<b>Como fazer — posição básica:</b><br><br>1. Deita de costas, joelhos dobrados, pés próximos ao quadril.<br>2. Mãos ao lado da cabeça, dedos apontando para os ombros.<br>3. Empurra o quadril para cima e estende os braços ao mesmo tempo.<br>4. Corpo forma um arco — ombros, quadril e joelhos alinhados.<br><br><b>Progressão por semanas:</b><br>• Sem 1–2: Bridge padrão<br>• Sem 3–4: Bridge hollow (aperta o core no topo)<br>• Sem 5+: Wall walkdown — começa em pé de costas para a parede, anda com as mãos pela parede para baixo até o bridge<br><br><b>Foco:</b> extensão da torácica (meio das costas), não só levantar a lombar.<br><br><b>Métrica de evolução:</b> fase atual + tempo de hold. Fase 1→2→3→4→5. Progride de fase quando 3×45s limpas na fase atual. Registra a fase toda sessão."},
 ]},
 {t:"DOWNREGULATION — PÓS-TREINO",ex:[
  {id:"down-seg",name:"Downregulation Protocol",sets:"5min",rest:0,tag:"down",
   how:"<b>Como fazer:</b><br><br><b>Parte 1 — Respiração 4-7-8 (3–4min):</b><br>1. Deita no chão de costas. Braços ao lado do corpo.<br>2. Inspira pelo nariz — 4 segundos.<br>3. Segura — 7 segundos.<br>4. Expira pela boca fazendo um som suave — 8 segundos.<br>5. Repete 5 vezes.<br><br><b>Parte 2 — Body Scan (1–2min):</b><br>1. Com os olhos fechados, leva a atenção para os pés. Sente o peso deles no chão. Relaxa conscientemente os músculos dos pés.<br>2. Sobe: panturrilhas → coxas → glúteos → abdômen → peito → ombros → braços → rosto.<br>3. Cada região: 10–15 segundos de atenção + relaxamento ativo.<br><br><b>Por que:</b> o treino pesado ativa o sistema simpático (luta/fuga). Sem downregulation deliberado, você sai do treino com cortisol alto que prejudica o sono dessa noite.<br><br><b>Métrica de evolução:</b> FC de repouso antes vs depois (mede com app de HRV). Deve cair 10–15bpm após os 5min. Se não cair, aumenta para 8 ciclos na próxima sessão."},
 ]},
]},
