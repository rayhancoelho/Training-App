 blocks:[
 {t:"LUZ SOLAR + HRV",ex:[
  {id:"sun-ter",name:"Exposição à Luz Solar + HRV",sets:"10min + 1min",rest:0,tag:"sun",
   how:"<b>Luz Solar + HRV — rotina matinal de terca.</b><br><br>1. Antes de levantar da cama: medicao de HRV (1min com Elite HRV ou Welltory)<br>2. Nos primeiros 30min apos acordar: 10min de exposicao a luz solar sem oculos<br><br><b>Como usar o HRV da terca:</b> e o dia de deadlift e glicolítico — os mais exigentes do SNC. Se o HRV estiver acima de 10% abaixo da media pessoal, reduz o volume do deadlift em 1 serie e pula o glicolítico ou reduz para 4 intervalos.<br><br><b>Correlacao que vai aparecer com semanas:</b> o HRV de terca geralmente e mais baixo que o de segunda (acumulo do treino de segunda). Se estiver muito baixo na terca, o treino de segunda foi alem da capacidade de recuperacao.<br><br><b>Metrica de evolucao:</b> HRV medio semanal deve subir progressivamente com o condicionamento."},
 ]},
 {t:"ATIVAÇÃO",ex:[
  {id:"deadbug",name:"Deadbug [2-0-2]",sets:"2×10/lado",rest:0,tag:"tempo",
   how:"TEMPO 2-0-2.<br><br><b>1.</b> Deita de costas. Braços estendidos para o teto. Joelhos dobrados a 90°, coxas verticais (posição de mesa).<br><b>2.</b> Pressiona a lombar CONTRA o chão — não deve caber a mão entre a lombar e o chão.<br><b>3.</b> Estende simultaneamente o <b>braço direito</b> (vai para trás, acima da cabeça) e a <b>perna esquerda</b> (estende para frente, fica a 15cm do chão) — movimento em <b>2 segundos</b>.<br><b>4.</b> Retorna em <b>2 segundos</b>. Troca de lado.<br><br><b>Regra absoluta:</b> se a lombar descolar do chão, o movimento parou.<br><br><b>Métrica de evolução:</b> número de reps sem a lombar descolar do chão. Começa com 6/lado. Progride para 10/lado. Depois adiciona peso nos tornozelos."},
  {id:"jefferson-curl",name:"Jefferson Curl",sets:"3×5",rest:45,tag:"mob",
   how:"<b>Jefferson Curl — força de coluna em amplitude máxima.</b><br><br> Em pé sobre uma caixa ou step (para ter ROM completo). Barra leve (5–15kg) ou halteres.<br><br> 1. Desce a cabeça primeiro — queixo vai para o peito<br> 2. Depois os ombros se arredondam para frente<br> 3. Depois a torácica arredonda<br> 4. Por último a LOMBAR — vai até o máximo com os joelhos quase estendidos<br> 5. Mantém 3s no ponto mais profundo<br> 6. Sobe pela sequência INVERSA — lombar, torácica, ombros, cabeça<br><br> <b>Progressão de carga:</b> +2.5kg a cada 2 semanas.<br><br> <b>Métrica de evolução:</b> distância das mãos aos pés na posição mais funda + carga utilizada."},
  {id:"l-hang",name:"L-hang na Barra",sets:"3×15–20s",rest:45,
   how:"<b>L-Hang — ativação de core específica para Front Lever.</b><br><br> 1. Pendurado na barra, pegada overhand<br> 2. Deprime as escápulas ativamente (ombros longe das orelhas)<br> 3. Eleva as pernas juntas até ficarem paralelas ao chão — formando um L<br> 4. Mantém as pernas ESTENDIDAS (joelhos retos) e o core contraído<br><br> <b>Versão mais fácil:</b> tuck hang (joelhos no peito em vez de pernas estendidas).<br><br> <b>O que sentir:</b> abdômen contraído e escápulas deprimidas. Se as escápulas sobem, o exercício perde o estímulo principal.<br><br> <b>Métrica de evolução:</b> tempo de hold. De 10s → 20s → joelhos levemente estendidos → pernas totalmente estendidas."},
  {id:"dragon-neg",name:"Dragon Flag — Negativa [5s]",sets:"3×3–5",rest:60,
   how:"<b>Dragon Flag Negativa — core de alta intensidade.</b><br><br> Deitado num banco. Segura as bordas atrás da cabeça com ambas as mãos — braços dobrados.<br><br> 1. Eleva as pernas e quadril até o corpo ficar quase vertical, apoiado nos ombros<br> 2. Com o corpo completamente rígido (não dobra o quadril), desce <b>lentamente em 4–5 segundos</b><br> 3. Para quando não conseguir mais controlar — usa as mãos para frear<br> 4. Sobe com ajuda das mãos<br><br> <b>Versão mais fácil:</b> joelhos dobrados durante a descida.<br><br> <b>Erro fatal:</b> dobrar o quadril para descer — o corpo deve descer como uma tábua rígida.<br><br> <b>Métrica de evolução:</b> tempo de descida + número de reps com pernas estendidas."},
  {id:"toe-spread",name:"Toe Spread + Foot Doming",sets:"2×10",rest:20,tag:"foot",
   how:"<b>Descalço, sentado ou em pé.</b><br><br><b>Toe Spread (5 reps):</b><br>1. Tenta abrir todos os dedos do pé ao máximo — especialmente o dedão separado dos outros.<br>2. Segura 3s. A maioria das pessoas mal consegue no início — é normal. Melhora em semanas.<br><br><b>Foot Doming (5 reps):</b><br>1. Com os dedos relaxados no chão, tenta levantar o arco do pé sem dobrar os dedos — como se fosse 'sugar' o chão para dentro do pé.<br>2. Segura 3s. O arco sobe, os dedos ficam no chão.<br><br><b>Por que:</b> ativa os músculos intrínsecos do pé que ficam dormentes com sapatos. Base para sprint, pistol squat e equilíbrio.<br><br><b>Métrica de evolução:</b> amplitude de separação do dedão dos outros dedos (foto de cima, compara mensalmente). Ausência de dor plantar ao longo do programa."},
  {id:"tme",name:"Terminal Knee Extension — Saúde do Joelho",sets:"3×15/lado",rest:30,tag:"knee",
   how:"<b>Terminal Knee Extension — saúde do joelho e VMO.</b><br><br> 1. Prende um elástico em algo fixo na altura do joelho. Fica de pé com o elástico atrás do joelho.<br> 2. Recua um passo para criar tensão no elástico<br> 3. Dobra levemente o joelho (~20°)<br> 4. Estende COMPLETAMENTE o joelho contra a resistência — a última parte da extensão (lockout) é onde o VMO trabalha<br> 5. Segura 1s no lockout. Desce controlado em 2s.<br><br> <b>VMO = vasto medial oblíquo</b> — o músculo interno da coxa que previne dor patelofemoral (dor atrás da patela).<br><br> <b>Métrica de evolução:</b> aumento progressivo da resistência do elástico. Ausência de dor de joelho ao longo do programa."},
  {id:"clam-shell",name:"Clam Shell — Saúde do Quadril",sets:"3×15/lado",rest:30,tag:"hip",
   how:"<b>Clam Shell — glúteo médio e saúde do quadril.</b><br><br> 1. Deita de lado, joelhos dobrados a ~45°, pés juntos (posição fetal)<br> 2. Mantendo os pés juntos, abre o joelho de CIMA como uma concha<br> 3. Abre o máximo possível sem o quadril rotacionar para trás<br> 4. Segura 2s no topo. Desce controlado.<br><br> <b>Progressão:</b> elástico acima dos joelhos.<br><br> <b>Onde sentir:</b> parte lateral do glúteo (glúteo médio). Se sentir na frente da coxa, o TFL está compensando — reduz a amplitude.<br><br> <b>Métrica de evolução:</b> resistência do elástico + amplitude de abertura."},
 ]},
 {t:"POTÊNCIA",ex:[
  {id:"hang-clean",name:"Hang Clean [máxima velocidade]",sets:"5×3",rest:150,
   how:"<b>Hang Clean — potência de quadril explosiva.</b><br><br> Barra na meia coxa, pegada overhand na largura dos ombros.<br><br> 1. Posição de hang: joelhos levemente dobrados, quadril ligeiramente inclinado para frente<br> 2. Extensão EXPLOSIVA e SIMULTÂNEA de quadril + joelhos + tornozelos + shrug dos ombros<br> 3. Imediatamente após o shrug: puxa os cotovelos para FORA e para CIMA, mergulhando sob a barra<br> 4. Recebe em posição de front squat — cotovelos ALTOS (paralelos ao chão), barra apoiada nos delts<br> 5. Sobe do front squat<br><br> <b>A potência vem do quadril</b> — os braços NÃO puxam, só guiam.<br><br> <b>Métrica de evolução:</b> carga. Progride 2.5–5kg a cada 2–3 semanas quando a técnica estiver consolidada."},
 ]},
 {t:"FORÇA — DEADLIFT",ex:[
  {id:"deadlift",name:"Deadlift Convencional [1-0-X]",sets:"5×3",rest:270,tag:"tempo",
   how:"<b>Deadlift Convencional — TEMPO X-0-1.</b><br><br> <b>Setup:</b><br> • Barra sobre o MEDIOPÉ (não na ponta dos dedos nem nos calcanhares)<br> • Pés na largura dos quadris<br> • Inclina: canelas tocam a barra, escápulas ACIMA da barra, lombar neutra<br> • Pegada: overhand ou mista, na largura dos ombros<br><br> <b>Execução:</b><br> 1. Antes de puxar: empurra o chão para BAIXO (como um leg press) — essa mudança de perspectiva muda a ativação<br> 2. Tira a folga da barra antes de aplicar força total (levanta até sentir tensão, depois força)<br> 3. Barra sobe rente às canelas e coxas<br> 4. Quadril e ombros sobem na MESMA velocidade — se o quadril sobe primeiro, vira um RDL<br> 5. Lockout: quadril para frente, glúteos contraídos<br><br> <b>Métrica de evolução:</b> 1RM. Atualiza no app. Progride 5kg a cada 2–3 semanas."},
  {id:"dl-iso",name:"Deadlift — Overcoming Isometric no Ângulo Fraco",sets:"3×8s",rest:90,tag:"iso",
   how:"<b>Deadlift Overcoming Isometric — força no ângulo crítico.</b><br><br> Configura pinos no rack no ponto onde o deadlift falha — geralmente na altura dos joelhos.<br><br> 1. Posição de deadlift com a barra nos pinos<br> 2. Inspira. Valsalva.<br> 3. Puxa com força MÁXIMA por 8 segundos — a barra não se move<br> 4. Descansa 90s. Repete.<br><br> <b>Intenção:</b> 100% de esforço. Se não está tremendo, não está empurrando com força suficiente.<br><br> <b>Métrica de evolução:</b> percepção de esforço no ângulo crítico do deadlift real. Em 3–4 semanas o platô quebra."},
  {id:"rdl",name:"Romanian Deadlift [4-0-1]",sets:"3×8–10",rest:120,tag:"tempo",
   how:"<b>Romanian Deadlift — TEMPO 4-0-1.</b><br><br> 1. Em pé com a barra na frente das coxas<br> 2. Empurra o quadril para TRÁS em 4 segundos — a barra desce rente às coxas<br> 3. Costas retas (não arredondadas) durante TODO o movimento<br> 4. Para no MÁXIMO alongamento dos isquiotibiais — não força além<br> 5. Sem pausa — sobe em 1 segundo empurrando o quadril para frente<br><br> <b>Diferença do deadlift:</b> joelhos quase estendidos (leve flexão). O movimento vem 100% do quadril.<br><br> <b>Métrica de evolução:</b> carga + qualidade do alongamento dos isquiotibiais."},
  {id:"slrdl",name:"Single Leg RDL [3-0-1]",sets:"3×8/lado",rest:90,tag:"tempo",
   how:"<b>Single Leg Romanian Deadlift — TEMPO 3-0-1.</b><br><br>1. Em pé em uma perna, perna de apoio com leve flexão no joelho.<br>2. Empurra o quadril para trás enquanto a perna livre sobe — os dois movimentos acontecem juntos.<br>3. Desce em <b>3s</b>. Costas completamente retas.<br>4. A perna livre fica em linha com o tronco — não pendura nem abre para o lado.<br>5. Sobe em <b>1s</b>.<br><br><b>Quadril QUADRADO:</b> a maior tendência é rotacionar o quadril da perna livre para cima. Não deixa isso acontecer — mantém o quadril nivelado como se tivesse um copo d'água nele.<br><br><b>Métrica de evolução:</b> carga nos halteres + simetria entre os dois lados. O lado fraco deve fechar a diferença progressivamente. Registra o peso e quantas reps limpas por lado."},
  {id:"nordic",name:"Nordic Curl — Negativas [5s]",sets:"3×4–6",rest:120,
   how:"<b>Nordic Curl Negativa — o mais eficaz para isquiotibiais.</b><br><br> 1. Ajoelhado no chão, tornozelos presos sob um banco ou barra<br> 2. Corpo rígido a partir dos joelhos — não dobra o quadril<br> 3. Desce para a frente em <b>4–5 segundos</b> usando SÓ os isquiotibiais<br> 4. Quando não conseguir mais controlar, usa as mãos para frear no chão<br> 5. Sobe com ajuda das mãos (ou elástico de assistência)<br><br> <b>Versão mais fácil:</b> joelhos dobrados durante a descida (reduz a distância).<br><br> <b>Progressão:</b> 3×4 negativas → 3×6 → tenta 1 positiva assistida (mãos mínimo possível na subida).<br><br> <b>Métrica de evolução:</b> número de reps controladas + distância percorrida antes de precisar das mãos."},
  {id:"depth-jump",name:"Depth Jump — Plyometria Reativa",sets:"4×6",rest:120,tag:"plyo",
   how:"<b>Depth Jump — plyometria reativa máxima.</b><br><br> Caixa baixa (20–30cm).<br><br> 1. Desce PISANDO no chão (não salta de cima)<br> 2. No instante que os pés tocam: salta IMEDIATAMENTE com máxima potência<br> 3. Tempo de contato = MÍNIMO (pés 'quicam')<br><br> <b>Não agacha antes de saltar</b> — o joelho mal dobra.<br><br> <b>Diferença do Box Jump:</b> usa energia elástica dos tendões. Treina o SSC (Ciclo Alongamento-Encurtamento).<br><br> <b>Descansa 2min completos entre séries</b> — é potência pura, CNS precisa recuperar totalmente.<br><br> <b>Métrica de evolução:</b> altura do salto resultante + rapidez do contato com o chão."},
  {id:"calf-ter",name:"Gêmeos Unilateral [2-1-2]",sets:"4×12–15",rest:60,tag:"tempo",
   how:"<b>Gêmeos Unilateral — TEMPO 2-1-2.</b><br><br> 1. Fica na borda de um step, só a ponta do pé apoiada<br> 2. Calcanhar ABAIXO do nível do step no início de cada rep (máximo alongamento)<br> 3. Sobe na ponta do pé em <b>2 segundos</b><br> 4. Segura <b>1 segundo</b> no topo com máxima contração<br> 5. Desce em <b>2 segundos</b> até o máximo alongamento<br><br> <b>Progressão:</b> começa sem carga → adiciona halter na mão → segura barra.<br><br> <b>Métrica de evolução:</b> carga extra + número de reps na fase de máximo ROM."},
  {id:"tibialis",name:"Tibialis Raise",sets:"3×15–20",rest:45,
   how:"<b>Tibialis Raise — antagonista do gêmeo.</b><br><br> Em pé, costas na parede, calcanhares a ~30cm da parede.<br><br> 1. Levanta as pontas dos pés o máximo possível — mantendo calcanhares no chão<br> 2. Segura 1s no topo<br> 3. Desce controlado em 2s<br><br> <b>Onde sentir:</b> parte frontal da canela (músculo tibial anterior).<br><br> <b>Por que:</b> previne shin splints, melhora a mecânica de corrida e equilibra a força do gêmeo.<br><br> <b>Progressão:</b> adiciona peso no tornozelo quando 3×20 ficar fácil.<br><br> <b>Métrica de evolução:</b> número de reps + amplitude de movimento."},
  {id:"tibialis-qui",name:"Tibialis Raise",sets:"3×15–20",rest:45,
   how:"Costas na parede, calcanhares a ~30cm. Levanta as pontas dos pés ao máximo. Segura 1s. Desce 2s. Parte frontal da canela.<br><br><b>Métrica de evolução:</b> número de reps com amplitude máxima + carga no tornozelo quando 3×20 ficarem fáceis. Registra semana a semana."},
  {id:"ankle-star",name:"Single Leg Balance — Estrela",sets:"3×8/lado",rest:30,tag:"prop",
   how:"<b>Star Balance — propriocepção de tornozelo e joelho.</b><br><br>1. Em pé em uma perna, mãos na cintura.<br>2. Sem apoiar a perna livre no chão entre os toques:<br>   • Toca à <b>frente</b> com a ponta do pé → volta<br>   • Toca ao <b>lado</b> → volta<br>   • Toca <b>atrás</b> → volta<br>Isso é 1 rep.<br><br><b>Regras:</b> perna de apoio fica quase estendida, tronco ereto, a perna livre toca levemente — não apoia.<br><b>Progressão:</b> olhos fechados na semana 6+.<br><br><b>Métrica de evolução:</b> distância máxima do toque (mais longe = melhor equilíbrio). Progressão: olhos abertos → olhos fechados → superfície instável."},
 ]},
 {t:"SKILL — FRONT LEVER [STRAIGHT ARM] + OAC [BENT ARM]",ex:[
  {id:"front-lever",name:"Tuck Front Lever Hold",sets:"5×8–15s",rest:90,tag:"sa",
   how:"<b>Tuck Front Lever Hold — STRAIGHT ARM.</b><br><br> 1. Pendurado na barra, braços COMPLETAMENTE estendidos — cotovelos nunca dobram<br> 2. Deprime as escápulas ATIVAMENTE (ombros longe das orelhas)<br> 3. Eleva o quadril e traz joelhos ao peito<br> 4. Empurra a barra para BAIXO ativamente — é uma puxada ativa, não posição passiva<br> 5. O corpo fica paralelo ao chão<br><br> <b>Progressão:</b><br> Tuck → Advanced Tuck: 5×15s limpos em 3 sessões → pernas mais estendidas<br> Advanced Tuck → One Leg: 5×15s limpos<br><br> <b>Métrica de evolução:</b> hold máximo por série. Registra na aba SKILLS todo domingo."},
  {id:"fl-row",name:"Tuck Front Lever Row [3-0-X]",sets:"4×4–6",rest:120,tag:"tempo",
   how:"<b>Tuck Front Lever Row — TEMPO 3-0-X.</b><br><br> 1. Começa no Tuck Front Lever (braços estendidos, corpo paralelo ao chão)<br> 2. Mantendo o tuck, puxa o corpo em direção à barra em <b>3 segundos</b> — cotovelos vão para trás e para cima<br> 3. O quadril NÃO cai durante a puxada — mantém o corpo paralelo ao chão<br> 4. Retorna explosivo com braços completamente estendidos<br><br> <b>Se o quadril cair:</b> a série acabou para aquele round — qualidade > quantidade.<br><br> <b>Métrica de evolução:</b> número de reps com quadril mantido paralelo."},
  {id:"archer-pu",name:"Archer Pull-Up [BENT ARM]",sets:"4×3–5/lado",rest:150,tag:"ba",
   how:"<b>Archer Pull-Up (Terça) — progressão OAC com foco em volume.</b><br><br> Mesma técnica da sexta. 4×4–5/lado com recuperação adequada.<br>Foca em diminuir gradualmente a assistência do braço estendido semana a semana.<br><br> <b>Métrica de evolução:</b> registro da assistência utilizada (elástico, % de força do braço estendido)."},
  {id:"pron-curl",name:"Pronação/Supinação + Curl Uma Mão",sets:"3×8/lado",rest:45,tag:"grip",
   how:"<b>Pronação/Supinação + Curl — força de cotovelo para OAC.</b><br><br> Pendurado na barra. Uma mão por vez.<br><br> <b>Parte 1 — Pronação/Supinação (8 reps):</b><br> Com o braço estendido: rotaciona o antebraço → palma vira para fora (pronação), depois para dentro (supinação). 8 ciclos lentos. Trabalha os músculos profundos do antebraço.<br><br> <b>Parte 2 — Curl Uma Mão (8 reps):</b><br> Palma para você (supinação). Dobra o cotovelo COMPLETAMENTE. Desce controlado em 2s.<br><br> <b>A outra mão toca levemente a barra para equilíbrio.</b><br><br> <b>Métrica de evolução:</b> número de curl reps + progressão para sem nenhuma assistência da outra mão."},
  {id:"elbow-mob",name:"Mobilidade de Cotovelo + PAILs/RAILs",sets:"2×60s",rest:20,tag:"pails",
   how:"<b>Mobilidade de Cotovelo, Pulso e Dedos — saude articular para OAC e skills.</b><br><br> <b>Parte 1 — Extensao passiva de cotovelo (45s por lado):</b><br> <b>1.</b> Estende o braco completamente — cotovelo em lockout<br> <b>2.</b> Com a outra mao, aplica pressao suave para aumentar a hiperextensao<br> <b>3.</b> Nao forca. Apenas resistencia suave por 45s.<br> <b>4.</b> PAILs: empurra o cotovelo CONTRA a hiperextensao por 8s (contrai o bicep)<br> <b>5.</b> RAILs: tenta hiperestender ainda mais por 8s<br><br> <b>Parte 2 — CARs de pulso (8 reps cada mao):</b><br> Rotacao completa do pulso — frente, lado, tras, lado — passando por cada grau devagar. Sem compensar com o cotovelo.<br><br> <b>Parte 3 — Extensao passiva de cada dedo (5s por dedo):</b><br> Com a outra mao, puxa suavemente cada dedo para tras. 5s. Mobiliza os tendoes flexores.<br><br> <b>Metrica de evolucao:</b> amplitude de hiperextensao do cotovelo + amplitude do CARs de pulso."},
 ]},
 {t:"GLICOLÍTICO — INTERVALOS",ex:[
  {id:"glico-ter",name:"Intervalos Glicolíticos",sets:"6×30s",rest:90,tag:"glic",
   how:"<b>Intervalos Glicolíticos — PROTOCOLO SEMANAL EXATO.</b><br><br> <b>6×30s de esforço máximo sustentável. 90s de caminhada entre cada intervalo.</b><br><br> <b>Intensidade correta:</b> a mais alta que consegues manter pelos 30s completos. Ao final de cada intervalo deve estar quase esgotado. Se ainda tem muito no tanque aos 30s → a intensidade está baixa demais.<br><br> <b>Opções (escolhe uma por sessão):</b><br> • Assault bike: pedalada máxima<br> • Remo: remada máxima<br> • Burpees máximos em 30s<br> • Sprint de 100m<br> • Battle rope<br><br> <b>90s de caminhada</b> — não senta, não para completamente.<br><br> <b>Só 1× por semana</b> — a via glicolítica leva 48–72h para recuperar.<br><br> <b>Métrica de evolução:</b> número de reps/metros em cada intervalo. Consistência entre o 1Âº e o 6Âº é a meta. Se o 6Âº cair >20% → diminui intensidade nos primeiros."},
 ]},
 {t:"PROTOCOLO PÓS",ex:[
  {id:"cold-ter",name:"Banho Frio — Protocolo Progressivo",sets:"ver semana",rest:0,tag:"cold",
   how:"<b>Protocolo de Frio — adaptacao progressiva semanal.</b><br><br> <b>Sem 1–2:</b> termina o banho quente com 60s de agua fria<br> <b>Sem 3–4:</b> termina com 90s de agua fria<br> <b>Sem 5–6:</b> 2min de agua fria ao final<br> <b>Sem 7–8:</b> banho frio completo de 3min<br> <b>Sem 9+:</b> 3min frio + imersao em balde/banheira se disponivel<br><br> <b>Como aguentar:</b> expira devagar pelo nariz — isso controla a resposta de choque ao frio. Nao prende a respiracao.<br><br> <b>Por que apos o treino de terca:</b> o deadlift e o glicolítico geram inflamacao muscular e acumulo de metabolitos. O frio acelera a remocao desses residuos e reduz a inflamacao sistemica.<br><br> <b>Metrica de evolucao:</b> tempo no frio + temperatura conseguida sem desconforto excessivo."},
 ]},
]},

{id:"qua",name:"QUA",full:"QUARTA",color:"#47ffe8",local:"Box",
 start:"07:45", end:"09:30", duration:"1h45min",
 focus:"Rotação + Mobilidade Completa + PAILs/RAILs + Cardiac Output",
 proto:"<b>Dia de recuperação ativa.</b> Sem força. Foco total em qualidade de movimento e capacidade aeróbica de base.",
 blocks:[
 {t:"LUZ + APNEIA",ex:[
  {id:"sun-qua",name:"Luz Solar + Apneia",sets:"10min + 6 ciclos",rest:0,tag:"breath",
   how:"<b>Luz Solar (10min):</b> sai para fora antes das 10h, sem oculos de sol, olha na direcao do sol por 10min.<br><br><b>Apneia - 6 ciclos (protocolo da semana):</b><br>Na quarta voce esta mais recuperado que na segunda. Faz 5 ciclos normais, depois testa 1 ciclo no proximo nivel de hold. Se ficou confortavel, sobe na proxima semana.<br><br><b>TABELA DE PROGRESSAO DO HOLD EXPIRATORIO:</b><br>Semana 1-2: <b>4 segundos</b><br>Semana 3-4: <b>6 segundos</b><br>Semana 5-6: <b>8 segundos</b><br>Semana 7-8: <b>10 segundos</b><br>Semana 9-10: <b>15 segundos</b><br>Semana 11-12: <b>20 segundos</b><br><br><b>1 CICLO:</b> Inspira 4s -> Segura cheio 4s -> Expira 8s -> Segura vazio X segundos (X = tabela acima).<br><br><b>PRONTO PARA PROGREDIR QUANDO:</b> completou todos os ciclos sem desconforto, sem urgencia de respirar antes do hold acabar.<br><b>PARE SE:</b> tontura, formigamento ou ansiedade. Reduz o hold."},
 ]},
 {t:"CARDIAC OUTPUT",ex:[
  {id:"cardiac-qua",name:"Cardiac Output — Remo ou Corrida Nasal",sets:"30–40min",rest:0,tag:"z1",
   how:"<b>Cardiac Output — PROTOCOLO EXATO.</b><br><br> <b>FC alvo: 130–140bpm EXATOS.</b> Nem mais, nem menos.<br><br> Escolhe: remo, corrida, ciclismo ou combinação.<br><br> 1. Respiração 100% nasal durante todo o tempo<br> 2. Se a respiração nasal ficar difícil → desacelera imediatamente<br> 3. Mantém a FC no alvo os 30–40min inteiros<br><br> <b>Parece fácil demais — é propositalmente assim.</b><br><br> <b>Por que funciona:</b> nessa FC específica, o coração bombeia o volume máximo de sangue por batimento (volume sistólico). Com o tempo, o coração literalmente aumenta de tamanho e eficiência.<br><br> <b>Métrica de evolução:</b> velocidade a 130–140bpm. Em 8 semanas, você corre mais rápido com a mesma FC. É o sinal mais claro de melhora cardiovascular."},
 ]},
 {t:"ROTAÇÃO E ANTI-ROTAÇÃO",ex:[
  {id:"pallof",name:"Pallof Press",sets:"3×10/lado",rest:60,
   how:"<b>Pallof Press — anti-rotação de core.</b><br><br> Cabo ou elástico preso na altura do peito. Fica de LADO para a âncora.<br><br> 1. Segura com ambas as mãos no peito<br> 2. Empurra as mãos para frente até braços estendidos — durante todo o movimento, o tronco NÃO rotaciona<br> 3. Mantém 2s com os braços estendidos<br> 4. Puxa de volta ao peito<br><br> <b>Quanto mais longe da âncora = mais difícil.</b><br><br> <b>Onde sentir:</b> oblíquos e core lateral resistindo ao cabo.<br><br> <b>Métrica de evolução:</b> carga no cabo ou resistência do elástico."},
  {id:"rotation-cable",name:"Rotação com Cabo",sets:"3×10/lado",rest:60,
   how:"<b>Rotação de Tronco com Cabo — potência rotacional.</b><br><br> Cabo na altura do peito. Fica de lado, braços estendidos segurando.<br><br> 1. Rotaciona o tronco EXPLOSIVAMENTE para longe da âncora — como tacada de golfe<br> 2. O movimento vem do TRONCO, não dos braços<br> 3. Retorna controlado em 3s<br><br> <b>Os braços ficam rígidos e estendidos</b> — são só a correia de transmissão.<br><br> <b>Métrica de evolução:</b> velocidade de rotação + carga."},
  {id:"suitcase-carry",name:"Suitcase Carry",sets:"3×30m/lado",rest:60,
   how:"<b>Suitcase Carry — core lateral com carga.</b><br><br> Halter ou KB pesado em UMA mão.<br><br> 1. Fica em pé, postura completamente ereta<br> 2. Ombros nivelados. Quadril nivelado.<br> 3. Caminha 30m resistindo ativamente à inclinação lateral<br> 4. Troca de lado<br><br> <b>A tendência natural é inclinar para o lado do peso</b> — resistir a isso é o exercício.<br><br> <b>Carga:</b> pesada o suficiente para que manter a postura seja desafiador.<br><br> <b>Métrica de evolução:</b> carga + qualidade da postura (avalia por vídeo)."},
  {id:"diagonal-pattern",name:"Padrão Diagonal com Cabo",sets:"3×10/lado",rest:45,tag:"sa",
   how:"<b>Padrão Diagonal com Cabo — trabalho tridimensional.</b><br><br>1. Cabo ou elástico preso baixo (no chão ou próximo).<br>2. Fica de pé de lado para a âncora. Pega com ambas as mãos.<br>3. Puxa em diagonal cruzando o corpo: de baixo-esquerda para cima-direita (ou vice-versa). Movimento de 'golpe de tênis'.<br>4. O movimento vem da rotação do tronco — não dos braços.<br>5. Retorna controlado em 3s.<br><br><b>Por que:</b> a maioria dos esportes e movimentos atléticos acontece em padrão diagonal, não sagital. Preenche um padrão que nenhum levantamento básico cobre.<br><br><b>Métrica de evolução:</b> carga no cabo + velocidade de rotação. Progride 2.5kg quando 3×10 com forma perfeita."},
 ]},
 {t:"MOBILIDADE TORÁCICA — PAILs/RAILs",ex:[
  {id:"thor-rot-pails",name:"Thread the Needle + PAILs/RAILs",sets:"3×90s/lado",rest:30,tag:"pails",
   how:"<b>Thread the Needle + PAILs/RAILs — rotação torácica com ganho permanente.</b><br><br>Faz o thread the needle normal até o limite de rotação.<br><br><b>PAILs (10s):</b> com o ombro já no chão, tenta empurrar o ombro PARA BAIXO com força máxima — como se tentasse afundá-lo mais. Tensiona os rotadores torácicos.<br><br><b>RAILs (10s):</b> tenta rotar ALÉM do limite — ombro tenta ir mais para o chão.<br><br>Descansa. Repete. Por último: sai da posição e testa a amplitude de rotação normal — você vai sentir a diferença.<br><br><b>Métrica de evolução:</b> amplitude de rotação ativa (testa: sai da posição e rotaciona livremente — compara o ângulo antes e depois). Deve aumentar semana a semana."},
  {id:"thor-open",name:"Abertura Torácica com Suporte",sets:"3×60s",rest:30,tag:"thor",
   how:"<b>Extensão Torácica Passiva — 3 posições ao longo da coluna.</b><br><br><b>Setup:</b> rolo de espuma (ou toalha enrolada bem firme) perpendicular à espinha.<br><b>Posição 1</b> (segmento médio-baixo, ~T8–T10): deita com o rolo nessa posição. Braços cruzados no peito ou estendidos acima da cabeça. Deixa a gravidade trabalhar por 60s — o peito vai afundando progressivamente.<br><b>Posição 2</b> (segmento médio, ~T6–T8): move o rolo alguns centímetros para cima. Mais 60s.<br><b>Posição 3</b> (segmento superior, ~T4–T6): mais alguns centímetros para cima. Mais 60s.<br><br><b>Não vai para a lombar</b> — mantenha o rolo sempre na parte torácica (abaixo das escápulas, acima da lombar).<br><br><b>Métrica de evolução:</b> amplitude de extensão do peito em relação ao chão (foto de lado). Deve aumentar progressivamente com as semanas."},
 ]},
 {t:"MOBILIDADE QUADRIL — 90/90 + PAILs/RAILs",ex:[
  {id:"9090-pails",name:"90/90 Hip Stretch + PAILs/RAILs",sets:"3×90s/lado",rest:30,tag:"pails",
   how:"<b>90/90 Hip Stretch + PAILs/RAILs — rotação interna de quadril.</b><br><br> <b>Posição 90/90:</b> perna da frente com joelho e canela no chão. Perna de trás com joelho dobrado a 90° ao lado.<br><br> <b>Passivo (60–90s):</b> inclina o tronco sobre a perna da frente. Sente o quadril fazendo rotação interna.<br><br> <b>PAILs (10s):</b> empurra o joelho da frente PARA BAIXO com força máxima. Não se move.<br><br> <b>RAILs (10s):</b> tenta aumentar ainda mais a rotação interna — joelho tenta ir mais para o chão.<br><br> Troca de lado.<br><br> <b>Por que é crítico:</b> rotação interna de quadril é a mais negligenciada. Limita o agachamento profundo, o pistol e protege o joelho.<br><br> <b>Métrica de evolução:</b> distância do joelho ao chão (foto de cima, compare mensalmente)."},
  {id:"pigeon-pails",name:"Pigeon Pose + PAILs/RAILs",sets:"3×90s/lado",rest:30,tag:"pails",
   how:"<b>Pigeon Pose + PAILs/RAILs — rotação externa de quadril.</b><br><br> Da posição de quatro apoios: traz o joelho para a frente em diagonal, canela no mat, perna traseira estendida.<br><br> <b>Passivo (60–90s):</b> baixa o quadril em direção ao chão.<br><br> <b>PAILs (10s):</b> empurra o joelho da frente PARA BAIXO e para fora (rotação externa) com força máxima.<br><br> <b>RAILs (10s):</b> tenta aprofundar ainda mais o pigeon — quadril vai mais para o chão.<br><br> Troca de lado.<br><br> <b>Métrica de evolução:</b> distância do quadril ao chão."},
  {id:"couch-stretch",name:"Couch Stretch + PAILs/RAILs",sets:"3×90s/lado",rest:30,tag:"pails",
   how:"<b>Couch Stretch + PAILs/RAILs — psoas profundo.</b><br><br> De joelhos de frente para uma parede. Pé traseiro sobe pela parede. Perna da frente em lunge.<br><br> <b>Passivo (60–90s):</b> tronco ereto ou levemente inclinado para trás. Quadril quadrado.<br><br> <b>PAILs (10s):</b> tenta dobrar o joelho traseiro mais (tensiona o quadríceps).<br><br> <b>RAILs (10s):</b> tenta estender o quadril ainda mais para frente.<br><br> Troca de lado.<br><br> <b>Métrica de evolução:</b> altura do pé na parede + amplitude de extensão de quadril."},
 ]},
 {t:"MOBILIDADE — PIKE & SPLITS + PAILs",ex:[
  {id:"pike-pails",name:"Pike + PAILs/RAILs",sets:"3×90s",rest:45,tag:"pails",
   how:"<b>Pike + PAILs/RAILs — isquiotibiais e flexores do quadril.</b><br><br> Sentado com pernas estendidas e unidas.<br><br> <b>Passivo (60–90s):</b> inclina o tronco com costas retas. Vai até o limite.<br><br> <b>PAILs (10s):</b> empurra as pernas PARA BAIXO contra o chão com força máxima. Contrai os isquiotibiais.<br><br> <b>RAILs (10s):</b> tenta aproximar o tronco AINDA MAIS das pernas. Contrai os flexores do quadril.<br><br> <b>Com peso nas costas</b> quando conseguir manter a coluna reta.<br><br> <b>Métrica de evolução:</b> distância da testa ao joelho."},
  {id:"head-toe",name:"Head to Toe",sets:"3×60s/lado",rest:30,
   how:"<b>Head-to-Toe — isquiotibial e posterior da perna.</b><br><br> P© elevado em superfície a ~80–100cm.<br><br> 1. Coloca o calcanhar na superfície, perna estendida<br> 2. Inclina o tronco em direção ao pé com costas RETAS — não arredonda<br> 3. PAILs (10s): tenta empurrar a perna para baixo contra a superfície<br> 4. RAILs (10s): tenta aproximar mais o tronco do pé<br> 5. Relaxa e vai mais fundo<br><br> <b>Métrica de evolução:</b> distância do nariz ao joelho."},
  {id:"pancake",name:"Pancake + Ativo",sets:"4×90s",rest:45,
   how:"<b>Pancake — flexão de tronco com pernas abertas.</b><br><br> 1. Senta com as pernas abertas ao máximo. Joelhos estendidos.<br> 2. Inclina o tronco para frente com costas RETAS (não arredondadas)<br> 3. Vai para o centro, depois para a direita, depois para a esquerda<br> 4. 90s em cada posição<br><br> <b>Versão ativa (ao final de cada série):</b> eleva cada perna 10× mantendo o joelho estendido — ativa os flexores do quadril no comprimento longo. Isso acelera o ganho mais que ficar só no passivo.<br><br> <b>Métrica de evolução:</b> distância do peito ao chão no centro."},
  {id:"middle-split-pails",name:"Middle Split + PAILs/RAILs",sets:"4 ciclos",rest:30,tag:"pails",
   how:"<b>Middle Split + PAILs/RAILs — 4 ciclos completos.</b><br><br> 1 ciclo = passivo + PAILs + RAILs:<br><br> <b>Passivo (60s):</b> desce ao limite. Respira e cede a cada expiração.<br><br> <b>PAILs (10s):</b> tenta FECHAR as pernas contra o chão — força máxima dos adutores. Não move.<br><br> <b>RAILs (10s):</b> tenta ABRIR as pernas ALÉM do limite. Abdutores e rotadores externos.<br><br> Descansa 30s. Repete.<br><br> <b>Mede a distância do quadril ao chão no INÍCIO de cada sessão.</b> Esta é a métrica de evolução principal. Deve diminuir progressivamente."},
  {id:"front-split-pails",name:"Front Split + PAILs/RAILs",sets:"3×90s/lado",rest:30,tag:"pails",
   how:"<b>Front Split + PAILs/RAILs — 3 ciclos por lado.</b><br><br> Quadril quadrado (não abre para o lado).<br><br> <b>Passivo (60–90s):</b> na posição limite. Respira e cede.<br><br> <b>PAILs (10s):</b> tenta FECHAR as pernas — isquiotibial da frente e psoas de trás. Força máxima.<br><br> <b>RAILs (10s):</b> tenta APROFUNDAR o split — frente vai mais longe, trás vai mais para trás.<br><br> <b>Ativo no final:</b> eleva a perna da frente 10× no final de cada série.<br><br> Troca de lado.<br><br> <b>Métrica de evolução:</b> distância do quadril ao chão. Registra mensalmente."},
 ]},
 {t:"ZONA 1 — PÓS-TREINO",ex:[
  {id:"z1-qua",name:"Zona 1 — Caminhada Intencional",sets:"15–20min",rest:0,tag:"z1",
   how:"<b>Zona 1 — Caminhada de Recuperação Ativa.</b><br><br>FC abaixo de 120bpm. Respiração nasal.<br><br>1. Caminha normalmente após o treino.<br>2. Se der para fazer ao sol — melhor ainda (combina os dois protocolos).<br><br><b>Por que não é 'descanso':</b> na zona 1, o corpo usa principalmente gordura como combustível e remove o lactato residual dos músculos. É recuperação ativa — mais eficaz que ficar parado.<br><br><b>Pode fazer os CARs enquanto caminha</b> — mobilidade + Z1 ao mesmo tempo.<br><br><b>Métrica de evolução:</b> velocidade de caminhada a FC 120bpm. Em 8 semanas caminha mais rápido com a mesma FC. Marca a distância percorrida em 20min toda semana."},
 ]},
]},

{id:"qui",name:"QUI",full:"QUINTA",color:"#ff6b35",local:"Box",
 start:"10:00", end:"12:00", duration:"2h",
 focus:"Agachamento + HSPU + Agilidade + Joelho + Manguito",
 proto:"<b>Pré:</b> 10min sol → 3min visualização → 5min apneia. <b>Pós:</b> 5min downregulation + banho frio.",
 blocks:[
 {t:"LUZ + NEURAL + APNEIA",ex:[
  {id:"sun-qui",name:"Luz Solar + Visualização + Apneia",sets:"10min + 3min + 5min",rest:0,tag:"viz",
   how:"<b>Luz Solar (10min):</b> sai para fora antes das 10h. Nao precisa de atencao especial - pode caminhar, alongar.<br><br><b>Visualizacao (3min):</b> fecha os olhos, visualiza em primeira pessoa o HSPU e o agachamento de hoje. Detalha: posicao das maos, sensacao no topo do HSPU, a descida do agachamento no fundo.<br><br><b>Apneia - 5 ciclos (protocolo da semana):</b><br>Mesmo protocolo da segunda. Registra o hold e compara: deve ser igual ou melhor que segunda. Se pior, o corpo nao recuperou - reduz volume de hoje.<br><br><b>TABELA DE PROGRESSAO DO HOLD EXPIRATORIO:</b><br>Semana 1-2: <b>4 segundos</b><br>Semana 3-4: <b>6 segundos</b><br>Semana 5-6: <b>8 segundos</b><br>Semana 7-8: <b>10 segundos</b><br>Semana 9-10: <b>15 segundos</b><br>Semana 11-12: <b>20 segundos</b><br><br><b>1 CICLO:</b> Inspira 4s -> Segura cheio 4s -> Expira 8s -> Segura vazio X segundos (X = tabela acima).<br><br><b>PRONTO PARA PROGREDIR QUANDO:</b> completou todos os ciclos sem desconforto, sem urgencia de respirar antes do hold acabar.<br><b>PARE SE:</b> tontura, formigamento ou ansiedade. Reduz o hold."},
  {id:"eye-qui",name:"Eye Tracking + Drills de Visão",sets:"2min",rest:0,tag:"vis",
   how:"Rastreamento suave 30s. Foco dinâmico (perto→longe) 30s. Convergência (aproxima o dedo do nariz) 30s. Optotipo dinâmico: lê letras a diferentes distâncias enquanto move a cabeça. Visão periférica: foca em um ponto central e tenta perceber o máximo da periferia sem mover os olhos. 2min de treino de visão por dia. Acumula 2 semanas de trabalho em 1 semana.<br><br><b>Métrica de evolução:</b> distância mínima de convergência (dedo mais perto do nariz antes de ver duplo). Mede semanalmente. Deve diminuir de ~20cm para ~10cm."},
 ]},
 {t:"ATIVAÇÃO + AGILIDADE",ex:[
  {id:"hip-cars",name:"Hip CARs",sets:"2×8/lado",rest:0,
   how:"<b>Em pé, mão na parede para equilíbrio. 1 perna de apoio, a outra faz o movimento.</b><br><br>Faz uma rotação LENTA e CONTROLADA do quadril no maior círculo possível:<br><b>1.</b> Eleva o joelho para a frente (flexão).<br><b>2.</b> Abre para o lado (abdução).<br><b>3.</b> Leva para trás (extensão).<br><b>4.</b> Fecha para dentro (adução).<br><b>5.</b> Retorna à posição inicial. Isso é 1 rep.<br><br><b>Regras:</b> lento — cada rep leva ~10s. O quadril de apoio e o tronco ficam completamente imóveis — só a perna que se move. Se o tronco inclina, o círculo é grande demais.<br><b>Por que:</b> lubrifica e mobiliza a articulação do quadril no seu ROM completo.<br><br><b>Métrica de evolução:</b> amplitude do círculo do quadril (foto de lado, ângulo de elevação anterior e posterior). Deve aumentar progressivamente."},
  {id:"ankle-mob",name:"Ankle Mobility Drill",sets:"2×15/lado",rest:0,
   how:"<b>Setup:</b> de pé descalço, pé a ~10cm da parede.<br><b>1.</b> Dobra o joelho em direção à parede, mantendo o calcanhar no chão.<br><b>2.</b> O joelho deve tocar a parede. Se não tocar, o pé está muito longe — aproxima.<br><b>3.</b> Volta. Repete 15 vezes.<br><br><b>Teste semanal:</b> mede a distância do dedão à parede quando o joelho ainda toca a parede com o calcanhar no chão. Registra. Objetivo: chegar a 12–15cm.<br><b>Por que:</b> dorsiflexão de tornozelo insuficiente causa o 'calcanhar levanta' no agachamento profundo e no pistol squat.<br><br><b>Métrica de evolução:</b> distância do dedão à parede quando o joelho ainda toca com o calcanhar no chão. Mede toda semana. Objetivo: chegar a 12–15cm."},
  {id:"agility-drill",name:"Agilidade — Ladder ou Marcações",sets:"6 passagens",rest:30,tag:"agil",
   how:"<b>Ladder ou marcações no chão — 6 passagens.</b><br><br> <b>Com ladder:</b> padrões básicos — um pé por espaço, dois pés, lateral.<br> <b>Sem ladder:</b> marca 8–10 pontos no chão a 50cm de distância. Mesmo padrão.<br><br> <b>O que importa:</b><br> • Tempo de contato MÍNIMO com o chão — os pés 'pulam', não arrastam<br> • Cada passagem com máxima velocidade<br> • Postura: tronco levemente inclinado para frente, braços ativos<br><br> <b>6 passagens:</b> 2 de padrão A, 2 de padrão B, 2 de padrão lateral.<br><br> <b>Métrica de evolução:</b> velocidade percebida + agilidade de mudança de apoio."},
  {id:"reaction-drill",name:"Drill de Tempo de Reação",sets:"3×12",rest:20,tag:"agil",
   how:"<b>Queda de Moeda — treino de tempo de reação neural.</b><br><br> 1. Estende o braço na horizontal, palma para cima<br> 2. Coloca a moeda na borda da mão<br> 3. Solta a moeda<br> 4. Tenta pegar com a MESMA mão antes que caia<br><br> <b>Progressão:</b><br> Fase 1: pega com a mesma mão<br> Fase 2: pega com a mão CONTRÁRIA (cruza o corpo)<br> Fase 3: realiza 2× mais rápido (mantém o cotovelo dobrado)<br><br> <b>12 tentativas por série.</b><br><br> <b>Métrica de evolução:</b> taxa de acerto (quantas em 12). Objetivo: 10/12 consistentes antes de avançar de fase."},
  {id:"deceleration",name:"Deceleration Sprint",sets:"5×20m",rest:60,tag:"agil",
   how:"<b>Deceleration Sprint — treina o freio controlado.</b><br><br> 5 repetições de 20m. 60s entre cada.<br><br> 1. Sprint máximo pelos primeiros 10–12m<br> 2. Nos últimos 8–10m: desacelera de forma INTENCIONAL e controlada<br> 3. Posição de desaceleração: joelhos dobram, quadril baixa, tronco levemente inclinado para frente — não trava as pernas<br><br> <b>Por que é crítico:</b> a maioria das lesões musculares acontece na desaceleração — no sprint, no corte, no aterrissamento. Treinar o freio previne lesões de isquiotibial e tornozelo.<br><br> <b>Métrica de evolução:</b> qualidade e controle da desaceleração (avalia por vídeo)."},
  {id:"hs-kickup",name:"Handstand Kick-up na Parede",sets:"5×5",rest:30,
   how:"<b>Chest-to-wall (peito voltado para a parede):</b><br><b>1.</b> Coloca as mãos a ~10–15cm da parede, dedos apontando para a parede.<br><b>2.</b> Uma perna à frente (perna de impulso), uma atrás.<br><b>3.</b> Olha para entre as mãos — não para a parede.<br><b>4.</b> Dobra a perna da frente, dá um passo e chuta a perna de trás para cima. A perna da frente acompanha.<br><b>5.</b> As duas pernas encontram a parede. Aperta o core e os glúteos.<br><br><b>Foco desta sessão:</b> consistência da entrada — não do hold. Faz 5 kick-ups seguidos com a mesma técnica.<br><b>Chest-to-wall vs costas para a parede:</b> o chest-to-wall força uma linha corporal melhor e é mais específico para o handstand livre.<br><br><b>Métrica de evolução:</b> consistência da entrada — quantas em 5 tentativas chegam no handstand completo. Objetivo: 5/5 consistentes antes de focar no hold."},
  {id:"down-qui",name:"Downregulation Protocol",sets:"5min",rest:0,tag:"down",
   how:"<b>Mesma sequência da segunda — repete nos dias pesados.</b><br><br><b>Parte 1 — Respiração 4-7-8 (3–4min):</b><br>1. Deita no chão. Braços ao lado do corpo.<br>2. Inspira pelo nariz — 4s.<br>3. Segura — 7s.<br>4. Expira pela boca — 8s.<br>5. Repete 5 vezes.<br><br><b>Parte 2 — Body Scan (1–2min):</b><br>Leva a atenção de baixo para cima: pés → panturrilhas → coxas → glúteos → abdômen → peito → ombros → rosto. 10–15s por região. Relaxa conscientemente cada parte.<br><br><b>Métrica de evolução:</b> FC de repouso antes vs depois. Deve cair 10–15bpm após os 5min. Registra a diferença toda sessão."},
  {id:"hollow",name:"Hollow Body Hold",sets:"3×25s",rest:30,
   how:"<b>Hollow Body Hold — base de toda a calistenia.</b><br><br> 1. Deita de costas. Braços estendidos acima da cabeça, junto às orelhas.<br> 2. Pressiona a lombar CONTRA o chão ativamente<br> 3. Eleva as pernas juntas a ~15–30cm do chão<br> 4. Eleva ombros e cabeça levemente — como um crunch parcial<br> 5. Mantém. Respira curto e controlado.<br><br> <b>Versão mais fácil:</b> joelhos dobrados a 90°.<br><br> <b>Versão mais difícil:</b> braços ao lado do corpo (menor alavanca).<br><br> <b>Métrica de evolução:</b> tempo de hold + distância das pernas ao chão (quanto mais baixo, mais difícil)."},
 ]},
 {t:"POTÊNCIA",ex:[
  {id:"box-jump",name:"Box Jump",sets:"5×6",rest:120,
   how:"<b>Box Jump — potência explosiva de membros inferiores.</b><br><br> Caixa a 40–60cm de altura. Fica a ~30cm na frente.<br><br> 1. Pés na largura dos ombros<br> 2. Rápido contramovimento: desce levemente os joelhos com os braços para trás<br> 3. Salta explosivo — braços sobem junto com o salto<br> 4. Aterrissa com AMBOS os pés na caixa simultaneamente<br> 5. Absorve a aterrissagem com joelhos e quadril (não aterrissa com pernas travadas)<br> 6. DESCE DA CAIXA ANDANDO — não salta de volta<br><br> <b>Descanso completo entre reps</b> (~20–30s) — é potência, não resistência. CNS precisa recuperar.<br><br> <b>Intenção importa mais que altura:</b> caixa mais baixa com máxima explosão > caixa alta com salto lento.<br><br> <b>Métrica de evolução:</b> altura da caixa. Progride 5cm quando 5×6 ficarem confortáveis."},
  {id:"clap-pushup",name:"Clap Push-Up [potência upper]",sets:"4×5",rest:60,tag:"plyU",
   how:"<b>Clap Push-Up — potência explosiva de upper body.</b><br><br> 1. Posição de flexão padrão<br> 2. Desce normalmente<br> 3. Sobe com MÁXIMA explosão, tentando tirar as mãos do chão<br> 4. Se conseguir tirar as mãos: bate palma no ar<br> 5. Aterrissa absorvendo com os cotovelos<br><br> <b>Versão mais fácil:</b> explosive push-up sem bater palma — só tirar as mãos do chão é suficiente.<br><br> <b>Descansa 15–20s entre reps</b> — é potência, cada rep deve ser máxima.<br><br> <b>Métrica de evolução:</b> altura das mãos do chão + velocidade subjetiva."},
 ]},
 {t:"SKILL — HSPU [BENT ARM]",ex:[
  {id:"viz-hspu",name:"Visualização — HSPU Específica",sets:"2min",rest:0,tag:"viz",
   how:"<b>Visualizacao Motora pre-HSPU — ensaio neural.</b><br><br> Senta ou deita em silencio. Fecha os olhos. Cronometro em 2min.<br><br> <b>Visualiza em primeira pessoa, com maximo detalhe:</b><br> <b>1.</b> Sente as maos no chao. A pressao dos dedos. Os ombros empurrando ativamente.<br> <b>2.</b> Kick-up para o handstand: o impulso da perna, o equilibrio no topo, os ombros estabilizando.<br> <b>3.</b> A descida do HSPU: cabeca descendo em 3s, a tensao nos deltoides, a pausa proxima ao chao.<br> <b>4.</b> A subida explosiva: os bracos se estendendo, o shrug invertido no lockout.<br><br> <b>Repete o ciclo completo 3–4 vezes em 2min.</b><br><br> <b>Por que funciona:</b> o cerebro ativa os mesmos neuronios motores durante visualizacao e execucao. O HSPU e um movimento complexo — o ensaio neural antes de fazer reduz erros e acelera a aprendizagem.<br> <b>Metrica de evolucao:</b> qualidade do detalhe da visualizacao — com semanas, voce consegue sentir cada fase com mais precisao."},
  {id:"hs-wall",name:"Handstand Chest-to-Wall",sets:"3×20–30s",rest:90,
   how:"<b>Handstand Chest-to-Wall — forma mais específica para o handstand livre.</b><br><br> <b>Chest-to-wall</b> = peito voltado para a parede (não costas).<br><br> 1. Mãos a <b>10–15cm</b> da parede, dedos apontando para a parede<br> 2. Kick-up normal — a perna vai em direção à parede, peito volta para ela<br> 3. Checklist de posição:<br>    â Braços completamente estendidos<br>    â Escápulas empurrando o chão (ativas, não passivas)<br>    â Quadril diretamente acima dos ombros<br>    â Core e glúteos contraídos<br>    â Pés juntos, dedos apontados<br><br> <b>Por que chest-to-wall:</b> a versão de costas permite fazer 'banana' (quadril para frente) que não transfere para o handstand livre.<br><br> <b>Métrica de evolução:</b> tempo de hold + qualidade da linha corporal (avalia por foto ou vídeo)."},
  {id:"hspu-pike",name:"HSPU Pike em Caixa [3-1-X]",sets:"4×5–8",rest:120,tag:"tempo",
   how:"<b>HSPU Pike em Caixa — TEMPO 3-1-X.</b><br><br> P©s em caixa ou banco. Mãos no chão na largura dos ombros.<br><br> 1. Caminha as mãos para trás até o corpo formar um V invertido<br> 2. Quanto mais vertical o quadril, mais difícil e mais específico para HSPU<br> 3. TEMPO 3-1-X: desce a cabeça ao chão em <b>3s</b>, pausa <b>1s</b> quase tocando, sobe explosivo<br> 4. No topo: empurra ativamente — escápulas se elevam (shrug invertido)<br><br> <b>Progressão semanal:</b> tenta caminhar as mãos mais para trás (quadril mais vertical).<br><br> <b>Métrica de evolução:</b> ângulo do quadril + número de reps limpas por série."},
  {id:"hspu-wall",name:"HSPU na Parede [3-1-X]",sets:"4×3–6",rest:150,tag:"tempo",
   how:"<b>HSPU na Parede — de costas para a parede. TEMPO 3-1-X.</b><br><br> 1. Handstand de costas para a parede. Mãos na largura dos ombros, dedos levemente para fora.<br> 2. TEMPO 3-1-X: desce a cabeça ao chão em <b>3 segundos</b>, pausa <b>1 segundo</b> com a cabeça próxima ao chão, empurra explosivo<br> 3. No lockout: <b>shrug invertido</b> — ombros sobem em direção aos pés, escápulas se elevam. É o lockout real.<br><br> <b>Progressão:</b> quando 4×6 limpas → tenta deficit com paraleletes (maior ROM na descida).<br><br> <b>Métrica de evolução:</b> número de reps + ROM (distância da cabeça ao chão no ponto mais baixo)."},
  {id:"hspu-iso",name:"HSPU — Overcoming Isometric",sets:"3×8s",rest:60,tag:"iso",
   how:"<b>Overcoming Isometric do HSPU — no ângulo mais fraco.</b><br><br>O ângulo mais fraco do HSPU é quando a cabeça está a 5–10cm do chão.<br><br>1. No handstand na parede, desce até exatamente esse ponto.<br>2. Empurra contra o chão com força <b>MÁXIMA</b> por 6s — sem subir.<br>3. Descansa. Repete.<br><br><b>O que sentir:</b> tensão máxima nos deltóides, tríceps e trapézio superior. Se não está sentindo, não está empurrando com força suficiente.<br><br><b>Métrica de evolução:</b> percepção de esforço no ângulo crítico durante o HSPU real. Em 3–4 semanas a posição mais baixa do HSPU parecerá visivelmente mais fácil."},
 ]},
 {t:"FORÇA — AGACHAMENTO",ex:[
  {id:"agach",name:"Agachamento Livre [2-1-X]",sets:"5×3–5",rest:210,tag:"tempo",
   how:"<b>Agachamento Livre — TEMPO 2-1-X.</b><br><br> <b>Setup low bar:</b> barra posicionada abaixo dos espinhos da escápula, apoiada nos delts posteriores.<br><br> 1. Pés levemente mais largos que os ombros, pontas levemente para fora<br> 2. Inspira, Valsalva<br> 3. Inicia o movimento pelo QUADRIL — não pelos joelhos<br> 4. Desce em <b>2 segundos</b> até abaixo do paralelo (full squat)<br> 5. Pausa <b>1 segundo</b> no fundo com tensão (não relaxa)<br> 6. Sobe explosivo — peito alto durante toda a subida<br><br> <b>Joelhos seguem a direção dos pés</b> — não caem para dentro.<br><br> <b>Métrica de evolução:</b> 1RM. Atualiza no app. +5kg a cada 2–3 semanas."},
  {id:"agach-iso",name:"Agachamento — Overcoming Isometric",sets:"3×8s",rest:90,tag:"iso",
   how:"<b>Overcoming Isometric do Agachamento — no ângulo mais fraco.</b><br><br>1. Configura pinos no rack a ~5cm abaixo do paralelo — onde o agachamento é mais difícil.<br>2. Vai para a posição de agachamento com a barra nos pinos.<br>3. Empurra contra os pinos com força <b>MÁXIMA</b> para cima por 6s.<br>4. A barra não se move. A intenção é total.<br><br><b>Peso na barra:</b> pode estar vazio ou com pouco peso — o objetivo é a intenção máxima contra algo imóvel.<br><br><b>Métrica de evolução:</b> percepção de esforço no ponto mais baixo do agachamento. Em 3–4 semanas o 'buraco' do agachamento parecerá mais fácil. Registra a sensação 1–10 a cada sessão."},
  {id:"bss",name:"Bulgarian Split Squat [3-0-X]",sets:"4×8/lado",rest:120,tag:"tempo",
   how:"<b>Bulgarian Split Squat — TEMPO 3-0-X.</b><br><br> P© de trás em banco ou step. Pé da frente no chão.<br><br> 1. Desce VERTICALMENTE em <b>3 segundos</b> — o tronco não vai para frente<br> 2. O joelho traseiro vai em direção ao chão<br> 3. Sem pausa — sobe explosivo empurrando o calcanhar da frente<br><br> <b>Ajuste do pé da frente:</b><br> • Mais para frente = mais glúteo<br> • Mais perto = mais quadríceps<br><br> <b>Lado fraco primeiro sempre.</b><br><br> <b>Métrica de evolução:</b> peso dos halteres + simetria entre os dois lados (o lado fraco deve fechar a distância progressivamente)."},
  {id:"pistol",name:"Pistol Squat — Progressão",sets:"3×5/lado",rest:90,
   how:"<b>Pistol Squat — progressão em 4 fases.</b><br><br> <b>Fase 1 — TRX/Elástico:</b> segura para equilíbrio. Agachamento completo em uma perna, calcanhar no chão.<br><br> <b>Fase 2 — Box Pistol:</b> agacha em uma perna até sentar em uma caixa. Desce devagar, não cai.<br><br> <b>Fase 3 — Pistol Completo:</b> sem assistência. Perna livre estendida para frente. Calcanhar da perna de apoio no chão.<br><br> <b>Fase 4 — Com Carga:</b> halter no peito ou KB.<br><br> <b>Regra:</b> lado mais fraco primeiro sempre.<br><br> <b>Métrica de evolução:</b> fase atual + número de reps limpas por lado."},
  {id:"hip-thrust",name:"Hip Thrust — Extensão de Quadril",sets:"4×10–12",rest:60,tag:"hip",
   how:"<b>Hip Thrust — extensão de quadril isolada.</b><br><br> Costas encostadas no banco, barra ou halter no quadril com almofada de proteção.<br><br> 1. Pés na largura dos quadris, joelhos a 90° quando o quadril estiver elevado<br> 2. Empurra o quadril para CIMA até formar linha reta de joelhos a ombros<br> 3. Glúteo MÁXIMO contraído no topo. Segura 1s<br> 4. Desce controlado — quadril não bate no chão entre reps<br><br> <b>Lombar não hiperextende no topo</b> — é extensão de quadril, não de lombar.<br><br> <b>Por que é essencial:</b> agachamento e deadlift trabalham glúteo em flexão. O hip thrust trabalha em extensão total — o ângulo de máxima ativação.<br><br> <b>Métrica de evolução:</b> carga na barra."},
  {id:"calf-qui",name:"Gêmeos Unilateral [2-1-2]",sets:"4×12–15",rest:60,tag:"tempo",
   how:"<b>Gemeos Unilateral — TEMPO 2-1-2. Mesmo protocolo da terca.</b><br><br>1. Fica na borda de um step, so a ponta do pe apoiada<br>2. Calcanhar ABAIXO do nivel do step no inicio (maximo alongamento)<br>3. Sobe em <b>2 segundos</b> ate a ponta do pe<br>4. Segura <b>1 segundo</b> no topo com maxima contracao<br>5. Desce em <b>2 segundos</b> ate o maximo alongamento<br><br><b>Progressao:</b> adiciona halter na mao quando 4x15 ficarem faceis.<br><br><b>Metrica de evolucao:</b> carga extra + numero de reps na amplitude completa."},
  {id:"tibialis-qui",name:"Tibialis Raise",sets:"3×15",rest:45,
   how:"Calcanhares no chão. Levanta a ponta dos pés. Desce controlado."},
  {id:"foot-work",name:"Foot Doming + Toe Spread",sets:"2×10",rest:20,tag:"foot",
   how:"<b>Toe Spread + Foot Doming — ativacao da musculatura intrinseca do pe.</b><br><br>Descalco. Em pe ou sentado.<br><br><b>Toe Spread (10 reps x 3s):</b><br>Tenta abrir TODOS os dedos ao maximo — especialmente o dedao para longe dos outros. A maioria das pessoas mal consegue no inicio. Normal. Melhora em semanas.<br><br><b>Foot Doming (10 reps x 3s):</b><br>Com os dedos relaxados no chao, contrai o ARCO do pe sem dobrar os dedos — como se fosse sugar o chao para dentro do pe. O arco sobe, os dedos ficam no chao.<br><br><b>Por que:</b> sapatos atrofiam os musculos intrinsecos do pe. Base para sprint, pistol squat e equilibrio.<br><br><b>Metrica de evolucao:</b> amplitude de abertura dos dedos + clareza do movimento de doming."},
 ]},
 {t:"MOBILIDADE + MANGUITO",ex:[
  {id:"9090-qui",name:"90/90 Hip Stretch",sets:"2×60s/lado",rest:30,tag:"mob",
   how:"<b>90/90 Hip Stretch — manutencao da rotacao interna de quadril.</b><br><br><b>Posicao:</b> senta no chao. Perna da frente com joelho e canela no chao a frente do corpo. Perna de tras com joelho dobrado a 90 graus ao lado do corpo.<br><br>1. Inclina o tronco sobre a perna da frente<br>2. Sente o quadril da frente fazendo rotacao interna — e um alongamento profundo na lateral do gluteo<br>3. Mantem 60s por lado<br><br><b>PAILs (10s):</b> tenta empurrar o joelho da frente para baixo com forca maxima.<br><b>RAILs (10s):</b> tenta aumentar a rotacao interna — joelho vai mais para o chao.<br><br><b>Por que e critico apos o agachamento:</b> o agachamento pesado comprime o quadril. O 90/90 descomprime e mantem a mobilidade de rotacao interna.<br><br><b>Metrica de evolucao:</b> distancia do joelho ao chao."},
  {id:"couch-qui",name:"Couch Stretch",sets:"2×60s/lado",rest:30,tag:"mob",
   how:"<b>Couch Stretch — manutencao do psoas apos BSS e agachamento.</b><br><br>De joelhos de frente para uma parede. Pe traseiro sobe pela parede, joelho no chao proximo a parede. Perna da frente em lunge a 90 graus.<br><br>1. Tronco ERETO — nao incline para frente<br>2. Quadril empurra levemente para frente e para baixo<br>3. Mantem 60s por lado<br><br><b>PAILs (10s):</b> tenta dobrar o joelho traseiro mais. Forca maxima sem mover.<br><b>RAILs (10s):</b> tenta estender o quadril ainda mais para frente.<br><br><b>Por que apos BSS e agachamento:</b> o psoas trabalha fortemente nessas sessoes e encurta. O couch stretch devolve o comprimento e reduz a tensao lombar.<br><br><b>Metrica de evolucao:</b> altura do pe na parede + sensacao de abertura no quadril anterior."},
  {id:"bridge-qui",name:"Bridge Progressivo",sets:"3×30s",rest:45,
   how:"<b>Bridge Progressivo — extensao de quadril e coluna.</b><br><br><b>Posicao base:</b> deita de costas, joelhos dobrados a 90 graus, pes no chao na largura dos quadris, bracos ao lado do corpo.<br><br>1. Inspira. Na expiracao, empurra os calcanhares contra o chao e eleva o quadril<br>2. Sobe ate formar linha reta de joelhos a ombros<br>3. Mantem o tempo prescrito respirando controlado<br>4. Desce devagar<br><br><b>Foco em extensao TORACICA — nao lombar:</b> imagina que o peito esta sendo puxado para cima em direcao ao teto. A lombar nao hiperextende.<br><br><b>Progressao:</b><br>Fase 1: bridge padrao<br>Fase 2: bridge com hollow (pelvis levemente retrovertida)<br>Fase 3+: bridge com os pes em superficie elevada ou uma perna<br><br><b>Metrica de evolucao:</b> tempo de hold + fase atingida."},
  {id:"rc-er-qui",name:"Rotação Externa Resistida + Side-Lying ER",sets:"3×15/lado",rest:30,tag:"rc",
   how:"<b>Rotacao Externa — manutencao do manguito rotador.</b><br><br> <b>Exercicio 1 — Side-lying ER (cotovelo colado):</b><br> <b>1.</b> Deita de lado, cotovelo a 90°, colado ao corpo<br> <b>2.</b> Rotaciona o antebraco para CIMA ate ficar vertical — cotovelo nao se move<br> <b>3.</b> Desce controlado em 2s<br> <b>4.</b> 15 reps. Troca de lado.<br><br> <b>Exercicio 2 — Band ER (braco a 90° de abducao):</b><br> <b>1.</b> Braco elevado a 90° para o lado<br> <b>2.</b> Cotovelo dobrado a 90° — antebraco apontando para frente<br> <b>3.</b> Contra elástico: rotaciona o antebraco para CIMA — como se apontasse para o teto<br> <b>4.</b> 15 reps por lado<br><br> <b>Por que e obrigatorio apos HSPU e agachamento:</b> quintessencialmente os dias mais intensos para os ombros. Sem esse trabalho preventivo, o manguito acumula estresse sem recuperacao.<br> <b>Metrica de evolucao:</b> carga do elástico + ausencia de dor de ombro ao longo do programa."},
  {id:"neck-qui",name:"Neck Training",sets:"2×10/direção",rest:30,
   how:"<b>Neck Training Isometrico — 4 direcoes.</b><br><br><b>Regra geral:</b> mao empurra a cabeca, pescoco resiste. A cabeca NAO se move — e isometria pura.<br><br><b>1. Frente (10 reps x 3s):</b> mao na testa. Empurra a cabeca para tras. Pescoco resiste.<br><b>2. Nuca (10 reps x 3s):</b> mao atras da cabeca. Empurra para frente. Pescoco resiste.<br><b>3. Lateral direita (10 reps x 3s):</b> mao na tempora direita. Empurra para a esquerda.<br><b>4. Lateral esquerda (10 reps x 3s):</b> mesmo do outro lado.<br><br><b>Forca aplicada:</b> comeca leve (40%) nas primeiras semanas. Aumenta 10% a cada 2 semanas.<br><br><b>Metrica de evolucao:</b> forca aplicada + ausencia de dor cervical ao longo do programa."},
 ]},

   how:"Respiração 4-7-8: 5 ciclos. Body scan completo. Essencial nos dias pesados para recuperar o sistema nervoso."},

{id:"sex",name:"SEX",full:"SEXTA",color:"#ff6b35",local:"Box",
 start:"06:45", end:"08:35", duration:"1h50min",
 focus:"Remada + Muscle-Up + Sprint + Work Capacity",

 blocks:[
 {t:"LUZ + HRV + NEURAL",ex:[
  {id:"sun-sex",name:"Luz Solar + HRV + Visualização",sets:"10min + 1min + 2min",rest:0,tag:"viz",
   how:"<b>Luz Solar + HRV + Visualizacao — protocolo de abertura da sexta.</b><br><br> <b>10min de sol matinal:</b><br> Sai para fora nos primeiros 30min apos acordar. Sem oculos de sol. Olha na direcao do sol por 10min.<br><br> <b>1min de HRV:</b><br> Antes de levantar da cama. App Elite HRV ou Welltory. Dedo na camera traseira por 60s.<br> Interpreta: acima da media → treina pesado; 10–15% abaixo → reduz volume 20%; 20%+ abaixo → so mobilidade.<br><br> <b>2min de visualizacao:</b><br> <b>1.</b> Fecha os olhos. Imagina que voce esta no box, maos na barra.<br> <b>2.</b> Visualiza o muscle-up: a puxada explosiva, o cotovelo passando sobre a barra, a pressao do dip no topo.<br> <b>3.</b> Visualiza o OAC: um braco, o movimento lento do cotovelo se dobrando, o lockout completo.<br> <b>4.</b> Passa por cada skill do dia como se estivesse executando de verdade.<br><br> <b>Metrica de evolucao:</b> HRV medio semanal crescendo ao longo dos meses."},
 ]},
 {t:"ATIVAÇÃO + AGILIDADE + WORK CAPACITY",ex:[
  {id:"scap-pu",name:"Scapular Pull-Ups",sets:"3×10",rest:45,
   how:"<b>Scapular Pull-Ups — isolamento das escápulas.</b><br><br> Pendurado na barra. Braços COMPLETAMENTE estendidos — cotovelos NÃO dobram em nenhum momento.<br><br> 1. Sobe as escápulas (ombros vão em direção às orelhas) — 2s<br> 2. Desce as escápulas ATIVAMENTE (ombros para longe das orelhas) — 2s<br> O corpo sobe e desce levemente só pelo movimento das escápulas.<br><br> <b>Onde sentir:</b> trapézio inferior, serrátil e grande dorsal na descida.<br><br> <b>Métrica de evolução:</b> amplitude de movimento (diferença visível entre a posição elevada e deprimida)."},
  {id:"hollow-sex",name:"Hollow Body Hold",sets:"2×25s",rest:30,
   how:"<b>1.</b> Deita de costas, braços estendidos acima da cabeça.<br><b>2.</b> Pressiona a lombar CONTRA o chão — não deve caber a mão entre a lombar e o chão.<br><b>3.</b> Eleva as pernas juntas a ~15–30cm do chão.<br><b>4.</b> Eleva levemente os ombros e a cabeça (como um crunch parcial).<br><b>5.</b> Mantém a posição com respiração controlada.<br><br><b>Versão mais fácil:</b> joelhos dobrados, pés a 30cm do chão.<br><b>O que sentir:</b> abdômen completamente contraído, lombar em contato com o chão durante todo o hold.<br><b>Por que:</b> é a base de todos os skills de calistenia — planche, muscle-up, handstand.<br><br><b>Métrica de evolução:</b> tempo de hold + distância das pernas ao chão (mais baixo = mais difícil). Progride reduzindo 5cm a cada 2 semanas quando o hold estiver estável."},
  {id:"hollow",name:"Hollow Body Hold",sets:"2×25s",rest:30,
   how:"<b>1.</b> Deita de costas, braços acima da cabeça.<br><b>2.</b> Lombar COLADA ao chão — pressiona ativamente.<br><b>3.</b> Pernas juntas a 15–30cm do chão.<br><b>4.</b> Ombros levemente levantados.<br><b>5.</b> Mantém com respiração curta e controlada.<br><br><b>Versão mais fácil:</b> joelhos dobrados."},
  {id:"hollow-sex",name:"Hollow Body Hold",sets:"2×25s",rest:30,
   how:"Lombar colada no chão. Braços acima, pernas a 15–30cm. Tensão total."},
  {id:"false-grip",name:"False Grip Hang",sets:"3×20–30s",rest:45,
   how:"<b>False Grip Hang — adaptação do tecido do pulso.</b><br><br> <b>False grip:</b> o PULSO fica sobre a argola — o osso do pulso (rádio distal) está em contato com a argola. É diferente do grip normal onde a mão envolve a argola por baixo.<br><br> 1. Coloca o pulso sobre a argola, não envolve normalmente<br> 2. Pendura com false grip<br> 3. Mantém 20–30s sem escorregar para o grip normal<br><br> <b>O tecido do pulso vai doer no início</b> — é normal. Desaparece em 2–4 semanas.<br><br> <b>Por que é necessário:</b> permite a transição do muscle-up sem reposicionar as mãos.<br><br> <b>Métrica de evolução:</b> tempo que consegue manter o false grip sem escorregar."},
  {id:"agil-sex",name:"Agilidade — Mudança de Direção + Diagonal",sets:"4 passagens",rest:30,tag:"agil",
   how:"<b>Mudança de Direção — dois objetos a 5m de distância.</b><br><br>1. Sprint do ponto A para o ponto B, toca com a mão no chão ou em um cone.<br>2. Muda de direção e volta. Isso é 1 rep.<br><br><b>Foco na desaceleração:</b> posição baixa ao chegar (joelhos dobram, quadril baixa, não freia com as pernas travadas).<br><b>Foco na aceleração:</b> primeiro passo explosivo saindo do ponto.<br><br><b>Padrão em T (séries 3–4):</b> frente → lateral esquerda → lateral direita → frente. Cronometra e tenta melhorar.<br><b>Recuperação completa entre reps</b> — é potência, não resistência.<br><br><b>Métrica de evolução:</b> tempo de cada passagem (cronometra com o celular). Deve diminuir semana a semana. Registra o melhor tempo de cada padrão."},
  {id:"work-capacity",name:"Work Capacity Circuit",sets:"3 rounds",rest:60,tag:"glic",
   how:"<b>3 rounds. Sem pausa entre exercícios dentro de cada round. 60s entre rounds.</b><br><br><b>Sequência:</b><br>10 Burpees → 10 KB Swings → 10 Box Jumps → 10 Push-ups<br><br><b>KB Swing:</b> barra no nível da meia coxa. Extensão explosiva do quadril projeta o KB para frente até a altura do ombro. Não é um squat — é um hinge. Os braços não puxam, só guiam.<br><br><b>Registra o tempo de cada round.</b> A melhora no tempo semana a semana é a métrica de work capacity. Não muda a carga — muda o tempo.<br><br><b>Métrica de evolução:</b> tempo de cada round. Registra os 3 tempos toda sessão. O mesmo trabalho deve ser feito em menos tempo semana a semana."},
 ]},
 {t:"SKILL — MUSCLE-UP [BENT ARM] + OAC",ex:[
  {id:"muscleup",name:"Muscle-Up na Barra [BENT ARM]",sets:"5×3–5",rest:180,tag:"ba",
   how:"<b>Muscle-Up Strict na Barra — BENT ARM.</b><br><br> Pegada overhand, mãos na largura dos ombros.<br><br> 1. <b>Puxada:</b> puxa até o peito tocar a barra — não para no queixo ou pescoço<br> 2. <b>Transição:</b> inclina o tronco para frente sobre a barra e empurra os cotovelos para baixo — os cotovelos passam de dobrados para cima para dobrados para baixo<br> 3. <b>Dip:</b> empurra até os braços estendidos<br><br> <b>Argolas (objetivo final):</b> false grip obrigatório (pulso SOBRE a argola). Strict é o alvo.<br><br> <b>Progressão:</b> barra strict → argolas com false grip → argolas strict<br><br> <b>Métrica de evolução:</b> número de reps strict consecutivas + progressão para argolas."},
  {id:"archer-sex",name:"Archer Pull-Up / OAC Progressão",sets:"5×4/lado",rest:150,tag:"ba",
   how:"<b>Archer Pull-Up — progressão para OAC. BENT ARM.</b><br><br> Pegada ABERTA na barra (50–70cm entre as mãos).<br><br> 1. Puxa o corpo em direção ao lado DIREITO — braço direito dobra completamente<br> 2. Braço esquerdo permanece ESTENDIDO como assistência<br> 3. Desce controlado. Alterna para o lado esquerdo.<br><br> <b>Progressão semanal:</b> reduz gradualmente a contribuição do braço estendido. Menos assistência = mais difícil.<br><br> <b>Critério de avanço:</b> 5 Archer limpas com braço estendido quase sem força → OAC com elástico fino.<br><br> <b>Métrica de evolução:</b> assistência do braço estendido (de 50% → 30% → 10% → 0%)."},
  {id:"oac-curl-sex",name:"Pronação/Supinação + Curl Uma Mão",sets:"3×8/lado",rest:45,tag:"grip",
   how:"<b>Pronacao/Supinacao + Curl Uma Mao — forca de cotovelo para OAC.</b><br><br>Pendurado na barra. Uma mao de cada vez.<br><br><b>Parte 1 — Pronacao/Supinacao (6 reps):</b><br>Com o braco estendido: rotaciona o antebraco — palma vira para fora (pronacao), depois para dentro (supinacao). 6 ciclos lentos.<br><br><b>Parte 2 — Curl Uma Mao (6 reps):</b><br>Palma para voce (supinacao). Dobra o cotovelo COMPLETAMENTE — a mao chega perto do ombro. Desce controlado em 2s.<br><br>A outra mao pode tocar levemente a barra para equilibrio.<br><br><b>Por que e critico para o OAC:</b> a forca isolada do cotovelo e frequentemente o gargalo final. Muitas pessoas tem forca de puxada mas faltam os ultimos graus de forca de cotovelo.<br><br><b>Metrica de evolucao:</b> numero de curl reps + progressao para sem assistencia da outra mao."},
  {id:"ring-support",name:"Ring Support Hold",sets:"4×20–30s",rest:60,
   how:"<b>Ring Support Hold — estabilidade de ombro em argolas.</b><br><br> 1. Argolas na altura do quadril. Salta para o suporte com braços estendidos.<br> 2. Vira as argolas para FORA (turnout) — pulsos giram até palmas ficarem para frente<br> 3. Deprime as escápulas — ombros longe das orelhas<br> 4. Core contraído, body hollow<br><br> <b>As argolas VÃO tremer</b> — é o ponto. Os estabilizadores do ombro é o objetivo.<br><br> <b>Progressão:</b> 10s → 15s → 20s → 30s. Quando 4×30s → adiciona dip movimento.<br><br> <b>Métrica de evolução:</b> tempo de hold + qualidade do turnout."},
  {id:"finger-ext",name:"Extensão de Dedos + Mobilidade de Mãos",sets:"3×15",rest:20,tag:"grip",
   how:"<b>Extensão de Dedos + Mobilidade de Mãos.</b><br><br><b>Elástico em volta dos dedos (12 reps):</b><br>Abre a mão completamente contra a resistência do elástico — todos os dedos abrem ao mesmo tempo. Fecha. 12× rápidos.<br><br><b>Extensão passiva de cada dedo:</b><br>Puxa cada dedo individualmente para trás suavemente. Segura 3s por dedo. Trabalha a mobilidade dos tendões flexores.<br><br><b>CARs de pulso:</b><br>Rotação completa do pulso, devagar, passando por cada grau — sem compensar com o cotovelo.<br><br><b>Métrica de evolução:</b> resistência do elástico + amplitude de extensão dos dedos. Progride para elástico mais resistente quando 3×15 ficarem fáceis."},
 ]},
 {t:"FORÇA — REMADA + OHP",ex:[
  {id:"pendlay",name:"Pendlay Row [1-0-X]",sets:"5×5",rest:180,tag:"tempo",
   how:"<b>Pendlay Row — TEMPO X-0-1 (barra perde contato com o chão).</b><br><br> 1. Barra no chão. Tronco horizontal (paralelo ao chão) — não inclinado<br> 2. Pegada overhand na largura dos ombros<br> 3. A barra parte do chão a cada rep — perde contato completo entre reps<br> 4. Puxa EXPLOSIVO ao umbigo. Cotovelos vão direto para trás.<br> 5. Retorna ao chão em 1s. Reposiciona. Repete.<br><br> <b>Por que bate no chão:</b> elimina momentum e força cada rep a ser um esforço máximo a partir do zero.<br><br> <b>Métrica de evolução:</b> carga. +2.5kg a cada 2–3 semanas."},
  {id:"pendlay-iso",name:"Pendlay Row — Overcoming Isometric",sets:"3×8s",rest:60,tag:"iso",
   how:"<b>Overcoming Isometric da Pendlay Row — no ângulo mais fraco.</b><br><br>O ângulo mais fraco da Pendlay é com a barra no meio do movimento — braços a ~90°.<br><br>1. Configura pinos no rack nessa altura.<br>2. Assume a posição de Pendlay com a barra nos pinos.<br>3. Puxa com força <b>MÁXIMA</b> por 6s — barra não se move.<br>4. Descansa. Repete."},
  {id:"ohp-sex",name:"Desenvolvimento Militar [2-1-X]",sets:"4×5–6",rest:150,tag:"tempo",
   how:"<b>Desenvolvimento Militar — volume extra de sexta.</b><br><br>Mesmo técnica de segunda mas com foco em 4–5 reps mais pesadas.<br><br>1. Em pé, pés na largura dos ombros. Barra na clavícula.<br>2. Inspira, contrai core e glúteos.<br>3. Empurra a barra até o lockout. Cabeça inclina para frente quando a barra passa.<br>4. Shrug ativo no topo.<br>5. Desce controlado em 2s.<br><br><b>Sem impulso de joelhos</b> — se precisar, a carga está alta demais."},
  {id:"remada-uni",name:"Remada Unilateral [3-0-1]",sets:"4×10/lado",rest:90,tag:"tempo",
   how:"<b>Remada Unilateral com Haltere — TEMPO 3-0-1.</b><br><br>1. Joelho e mão do mesmo lado apoiados em um banco. Corpo horizontal. Haltere na mão livre.<br>2. Braço parte estendido (haltere quase tocando o chão).<br>3. Puxa o haltere em direção ao <b>quadril</b> — não à axila. Cotovelo vai direto para trás.<br>4. Escápula retrai no topo — sente o 'aperto' entre as omoplatas.<br>5. Desce em <b>3s</b>. Sobe em <b>1s</b>.<br><br><b>Não rotaciona o tronco</b> para ajudar na puxada — o movimento vem 100% do braço e da escápula."},
  {id:"face-pull-sex",name:"Face Pull",sets:"3×15–20",rest:45,
   how:"<b>Face Pull — manutencao do ombro apos semana inteira de pressing.</b><br><br> Cabo ou elástico na altura dos olhos.<br><br> <b>1.</b> Segura com ambas as maos, palmas para dentro<br> <b>2.</b> Puxa em direcao ao rosto — as maos se separam conforme puxam, terminando nas temporas<br> <b>3.</b> Cotovelos ficam na altura dos ombros ou acima, apontando para os lados<br> <b>4.</b> Os ombros ROTACIONAM EXTERNAMENTE no final do movimento — sente o ombro girar para fora<br> <b>5.</b> Pausa 1s no final. Retorna controlado.<br><br> <b>Por que e obrigatorio na sexta:</b> a semana acumula supino (segunda), HSPU (quinta) e OHP (sexta). Esse volume de pressing cronicamente encurta o peitoral e o deltóide anterior. O face pull e a correcao.<br> <b>Metrica de evolucao:</b> carga no cabo + sensacao de ombro saudavel ao longo do programa."},
  {id:"rc-sex",name:"Side-Lying External Rotation — Manguito",sets:"3×15/lado",rest:30,tag:"rc",
   how:"<b>Side-Lying External Rotation — manutenção do manguito.</b><br><br>1. Deita de lado. Cotovelo dobrado a 90°, antebraço horizontal, colado ao corpo.<br>2. Halter leve (2–3kg) ou elástico na mão.<br>3. Rotaciona o antebraço para cima até ficar vertical — o cotovelo permanece colado ao corpo em todos os momentos.<br>4. Desce em 2s.<br><br><b>Importante:</b> após cada bloco de pressing pesado na semana (supino segunda, HSPU quinta, OHP sexta), o manguito precisa desse trabalho preventivo.<br><br><b>Métrica de evolução:</b> carga no halter + ausência de dor de ombro."},
 ]},
 {t:"FUNCIONAL",ex:[
  {id:"farmers",name:"Farmer's Carry",sets:"4×40m",rest:90,
   how:"<b>Farmer's Carry — força funcional de grip e postura.</b><br><br> Halteres ou KBs pesados em ambas as mãos.<br><br> 1. Postura completamente ereta: ombros para trás e para baixo, core contraído<br> 2. Olhar para frente<br> 3. Passos controlados — não deixa os pesos balançar<br> 4. Respira pelo nasos durante o carry<br><br> <b>Se a postura colapsar → carga está alta demais.</b><br><br> <b>Progressão:</b> +5kg quando conseguir completar as 4 séries com postura perfeita.<br><br> <b>Métrica de evolução:</b> carga total carregada."},
  {id:"overhead-carry",name:"Overhead Carry Unilateral",sets:"3×30m/lado",rest:90,
   how:"<b>Overhead Carry Unilateral — estabilidade de ombro e core lateral.</b><br><br> 1. Eleva um halter ou KB acima da cabeça com braço COMPLETAMENTE estendido<br> 2. Ombro do braço elevado empurra ativamente para cima — não deixa o ombro subir em direção à orelha<br> 3. O tronco tende a inclinar para o lado oposto — resiste com o core lateral<br> 4. Caminha 30m com passos controlados<br><br> <b>Troca de lado.</b><br><br> <b>Métrica de evolução:</b> carga + qualidade da postura (vídeo de lado)."},
 ]},
 {t:"CARDIO",ex:[
  {id:"sprint-sex",name:"Sprint 30–40m",sets:"8×40m",rest:150,
   how:"<b>Sprint de 40m — distância de manutenção.</b><br><br> 8 sprints. 150s de caminhada entre cada um.<br><br> 1. Saída parada. Posição ligeiramente inclinada para frente.<br> 2. Primeiros 10m: aceleração máxima, corpo inclinado<br> 3. Últimos 30m: manutenção da velocidade máxima<br> 4. Desacelera de forma controlada após a linha<br> 5. Caminha de volta (recuperação completa)<br><br> <b>Diferença da terça:</b> distância maior treina a manutenção da velocidade pico, não só a aceleração inicial.<br><br> <b>Métrica de evolução:</b> tempo dos 40m (cronometra a cada semana). Deve diminuir progressivamente."},
 ]},
 {t:"PROTOCOLO PÓS",ex:[
  {id:"contrast-sex",name:"Contraste Térmico — Calor + Frio",sets:"20min total",rest:0,tag:"cold",
   how:"<b>A partir da semana 3.</b><br><br>Protocolo: <b>5min calor</b> (sauna ou banho quente máximo) → <b>1min frio</b> → <b>5min calor</b> → <b>1min frio</b>.<br>Termina sempre no frio.<br><br><b>No frio:</b> respira lento e controlado — não prende a respiração. Expira devagar. Isso controla a resposta ao estresse do frio.<br><br><b>Por que funciona:</b> a vasodilatação do calor seguida de vasoconstrição do frio cria um efeito de 'bomba' nos vasos sanguíneos que acelera a remoção de resíduos metabólicos dos músculos."},
 ]},
]},

{id:"sab",name:"SÁB",full:"SÁBADO",color:"#a78bfa",local:"Casa",
 start:"06:45", end:"10:15", duration:"3h30min",
 focus:"Skill Intensivo + Força Suplementar + Mobilidade Profunda + Sauna",
 proto:"<b>Dia mais longo da semana — aproveita o tempo livre.</b> Manhã: skill + força suplementar. Tarde: mobilidade profunda. Noite: sauna + downregulation. Sem pressa em nenhum bloco.",
 blocks:[
 {t:"ABERTURA — LUZ + NEURAL + APNEIA",ex:[
  {id:"sun-sab",name:"Luz Solar Matinal",sets:"15–20min",rest:0,tag:"sun",
   how:"<b>Luz Solar Matinal — versao longa do fim de semana. 15-20min.</b><br><br>Nos primeiros 30min apos acordar. Sem oculos de sol.<br><br>Combina com a caminhada inicial: faz a caminhada ao sol — dois protocolos em um.<br><br><b>Por que mais longo no sabado:</b> no fim de semana sem pressao de horario, aproveita para o protocolo completo. 20min de exposicao matinal no sabado melhora o ciclo circadiano da semana inteira.<br><br><b>Opcional — Grounding:</b> se possivel, faz descalco na grama. Combina tres protocolos: luz solar + zona 1 + grounding.<br><br><b>Metrica de evolucao:</b> qualidade do sono (1-10) rastreada no app. Deve melhorar progressivamente nas primeiras 4 semanas."},
  {id:"viz-sab",name:"Visualização + Foco Deliberado",sets:"5min",rest:0,tag:"viz",
   how:"<b>Visualizacao Motora — 5min. O mais longo da semana.</b><br><br> Senta ou deita. Fecha os olhos. Satura a mente com os movimentos do dia antes de executa-los.<br><br> <b>Sequencia (aprox. 1min por skill):</b><br><br> <b>1. Handstand livre:</b> kick-up, equilibrio nos dedos, respiracao no topo, micro-ajustes.<br><br> <b>2. Tuck Planche:</b> depressao + protracao maxima, quadril subindo, corpo paralelo ao chao, bracos tremendo de tensao.<br><br> <b>3. Front Lever:</b> escápulas deprimindo, empurrando a barra para baixo, corpo paralelo ao chao.<br><br> <b>4. OAC:</b> um braco, o cotovelo se dobrando devagar, o corpo subindo verticalmente sem rotacao lateral.<br><br> <b>5. Muscle-up em argolas:</b> false grip, puxada ao peito, transicao dos cotovelos, dip no topo.<br><br> <b>Metrica de evolucao:</b> qualidade e resolucao do detalhe imaginado. Com semanas, cada fase do movimento fica mais nitida na mente."},
  {id:"apneia-sab",name:"Apneia — Sessão Intermediária",sets:"6 ciclos",rest:0,tag:"breath",
   how:"<b>SABADO - 6 ciclos. Sessao intermediaria.</b> Sabado sem fadiga = melhor ambiente para testar progressao. Faz 5 ciclos normais + 1-2 no proximo nivel.<br><br><b>TABELA DE PROGRESSAO DO HOLD EXPIRATORIO:</b><br>Semana 1-2: <b>4 segundos</b><br>Semana 3-4: <b>6 segundos</b><br>Semana 5-6: <b>8 segundos</b><br>Semana 7-8: <b>10 segundos</b><br>Semana 9-10: <b>15 segundos</b><br>Semana 11-12: <b>20 segundos</b><br><br><b>1 CICLO COMPLETO:</b><br><b>Passo 1 - INSPIRA (4s):</b> pelo nariz, lento. Abdomen > costelas > peito.<br><b>Passo 2 - SEGURA CHEIO (4s):</b> sem tensao. So segura.<br><b>Passo 3 - EXPIRA (8s):</b> pelo nariz, lento. Peito > costelas > abdomen.<br><b>Passo 4 - SEGURA VAZIO (X s):</b> X = o tempo da sua semana atual (tabela acima).<br><br><b>PRONTO PARA PROGREDIR QUANDO:</b><br>Completou todos os ciclos sem desconforto, sem urgencia de respirar antes do hold acabar.<br><br><b>PARE SE:</b> tontura, formigamento, ansiedade. Reduz o hold.<br><br><b>Métrica de evolução:</b> hold expiratório máximo confortável. Registra o melhor hold de cada sessão de sábado."},
 ]},
 {t:"HANDSTAND — SESSÃO ESTENDIDA 40MIN",ex:[
  {id:"hs-entry-sab",name:"Kick-up Consistente",sets:"10min",rest:0,
   how:"<b>Handstand — Pratica de Entrada. 10min.</b><br><br> Foco EXCLUSIVO na qualidade do kick-up. Nao tenta fazer holds longos agora — so entrar consistentemente.<br><br> <b>Tecnica do kick-up (chest-to-wall):</b><br> <b>1.</b> Maos a 10–15cm da parede, dedos apontando para a parede<br> <b>2.</b> Uma perna a frente (perna de impulso), dobrada<br> <b>3.</b> Olha para o espaco ENTRE as maos — nao para a parede<br> <b>4.</b> Da um passo com a perna da frente e chuta a perna de tras para cima<br> <b>5.</b> A perna da frente acompanha — as duas chegam juntas<br> <b>6.</b> Peso distribuido pelos DEDOS DAS MAOS — eles controlam o equilibrio<br><br> <b>Meta dos 10min:</b> 25–35 kick-ups. Nao fica parado tentando segurar — pratica a entrada repetidamente.<br><br> <b>Obs — Chest-to-wall vs costas para a parede:</b> chest-to-wall forca a linha corporal correta. Costas para a parede permite a banana (quadril para frente) que nao transfere para o handstand livre.<br><br> <b>Metrica de evolucao:</b> consistencia da entrada — quantos kick-ups resultam em uma posicao solida nos 10min."},
  {id:"hs-holds-sab",name:"Hold Tentativas — Tempo Livre",sets:"10min",rest:0,
   how:"<b>Handstand — Tentativas de Hold Livre. 10min.</b><br><br> Parede proxima como seguranca, mas objetivo e ficar sem encostar.<br><br> <b>Protocolo dos 10min:</b><br> <b>1.</b> Kick-up<br> <b>2.</b> Tenta ficar sem a parede o maximo possivel<br> <b>3.</b> Quando for cair, encosta na parede ou sai com seguranca<br> <b>4.</b> 15–20s de descanso<br> <b>5.</b> Repete<br><br> <b>Como controlar o equilibrio:</b><br> Os DEDOS DAS MAOS controlam tudo — pressiona os dedos quando o corpo vai cair para frente, alivia quando vai para tras. Pensa nos dedos como os freios de uma bike.<br><br> <b>Respira normalmente no hold</b> — prender a respiracao e sinal de tensao excessiva.<br><br> <b>Registra o melhor hold da sessao na aba SKILLS.</b><br><br> <b>Metrica de evolucao:</b> melhor hold semanal. Deve subir 1–3s por semana no inicio."},
  {id:"wall-walk-sab",name:"Wall Walk — Volume Aumentado",sets:"5×3",rest:60,
   how:"<b>Wall Walk — volume extra de handstand.</b><br><br> <b>1.</b> Deita de costas com os pes na parede, perto da parede<br> <b>2.</b> Coloca as maos no chao ao lado da cabeca<br> <b>3.</b> Empurra o chao e comeca a andar com as maos para longe da parede enquanto os pes sobem pela parede<br> <b>4.</b> Continua ate as maos estarem o mais perto possivel da parede — corpo no handstand<br> <b>5.</b> Segura 3–5s no topo verificando o checklist: bracos estendidos, escápulas ativas, core e gluteos<br> <b>6.</b> Desce caminhando na ordem inversa — controlado<br><br> <b>5 series de 3 reps</b> — mais volume do que na quinta.<br><br> <b>Progressao:</b> aproximar as maos mais da parede a cada semana (range de movimento maior).<br><br> <b>Metrica de evolucao:</b> distancia das maos a parede no topo (menos = melhor)."},
  {id:"hs-line-sab",name:"Linha Corporal — Chest-to-Wall",sets:"5×30s",rest:45,
