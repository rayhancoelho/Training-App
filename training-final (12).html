<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{height:100%;background:#0a0a0a;color:#f0f0f0;font-family:-apple-system,system-ui,sans-serif;overflow:hidden;}
:root{
  --bg:#050505;--card:#111;--card2:#161616;--faint:#1c1c1c;--border:#242424;
  --accent:#e8ff47;--teal:#3de8d0;--orange:#ff5c1a;--purple:#b06dff;
  --green:#3de88a;--pink:#f472b6;--sky:#38d9ff;--text:#f0f0f0;--muted:#555;
}
.app{display:flex;flex-direction:column;height:100vh;height:100svh;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px;min-height:0;}
.screen{display:none;}.screen.active{display:block;}
.hdr{background:#080808;border-bottom:1px solid var(--border);padding:12px 16px 10px;position:sticky;top:0;z-index:40;}
.hdr-row{display:flex;justify-content:space-between;align-items:center;}
.hdr-day{font-size:22px;font-weight:900;letter-spacing:0.02em;}
.hdr-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.hdr-badge{font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;}
.day-strip{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);background:var(--card);}
.day-strip::-webkit-scrollbar{display:none;}
.day-pill{flex-shrink:0;min-width:52px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);cursor:pointer;text-align:center;transition:all 0.15s;}
.dp-name{font-size:11px;font-weight:700;font-family:monospace;color:var(--muted);}
.dp-dot{width:5px;height:5px;border-radius:50%;background:var(--border);margin:4px auto 0;}
.proto-banner{padding:10px 16px;font-size:11px;color:#888;font-family:monospace;border-bottom:1px solid var(--border);background:var(--bg);line-height:1.7;}
.proto-banner b{color:var(--accent);}
.ex-list{padding:10px 16px 20px;}
.block-hdr{font-size:9px;font-family:monospace;letter-spacing:0.18em;margin:22px 0 8px;display:flex;align-items:center;gap:10px;font-weight:700;}
.block-hdr::after{content:'';flex:1;height:1px;background:var(--border);}
.block-hdr:first-child{margin-top:6px;}
.ex-card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;overflow:hidden;transition:border-color 0.15s;}
.ex-card:active{border-color:var(--border);}
.ex-card.done{border-color:rgba(232,255,71,0.25);background:#131309;}
.ex-row{display:flex;align-items:center;gap:12px;padding:14px;min-height:64px;cursor:pointer;}
.ex-tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--faint);}
.ex-card.done .ex-tick{background:var(--accent);border-color:var(--accent);color:#000;}
.ex-mid{flex:1;min-width:0;}
.ex-name{font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-0.01em;}
.ex-meta{font-size:11px;color:var(--muted);margin-top:3px;font-family:monospace;letter-spacing:0.02em;}
.ex-best{font-size:11px;color:var(--teal);margin-top:2px;font-family:monospace;}
.ex-qual{font-size:11px;color:var(--purple);margin-top:2px;font-family:monospace;}
.ex-spine{font-size:11px;color:#f87171;margin-top:2px;font-family:monospace;}
.ex-diff{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;font-family:monospace;margin-left:6px;vertical-align:middle;letter-spacing:0.06em;}
.rating-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px 12px;background:var(--faint);border-radius:8px;}
.rating-lbl{font-size:11px;color:var(--muted);font-family:monospace;min-width:90px;}
.r-btns{display:flex;gap:3px;flex-wrap:wrap;}
.r-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;font-family:monospace;}
.r-btn.sel-q{background:var(--purple);border-color:var(--purple);color:#000;}
.r-btn.sel-d{background:#fb923c;border-color:#fb923c;color:#000;}
.r-btn.sel-s{background:#f87171;border-color:#f87171;color:#000;}
.ex-chev{font-size:18px;color:var(--muted);flex-shrink:0;transition:transform 0.2s;}
.ex-card.open .ex-chev{transform:rotate(180deg);}
.ex-body{display:none;border-top:1px solid var(--border);}
.ex-card.open .ex-body{display:block;}
.tag{display:inline-block;font-size:8px;padding:1px 6px;border-radius:3px;font-family:monospace;margin-left:5px;vertical-align:middle;letter-spacing:0.05em;}
.howto{padding:14px 16px;background:#0a0a0a;border-bottom:1px solid var(--border);}
.howto-lbl{font-size:9px;color:var(--accent);font-family:monospace;letter-spacing:0.12em;margin-bottom:10px;}
.howto-txt{font-size:13px;color:#aaa;line-height:1.85;}
.howto-txt b{color:var(--accent);font-weight:600;}
.rest-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0e0e0e;border-top:1px solid var(--border);}
.rest-info{display:flex;flex-direction:column;gap:2px;}
.rest-lbl{font-size:9px;color:var(--muted);font-family:monospace;letter-spacing:0.1em;}
.rest-val{font-size:16px;font-weight:700;color:var(--accent);font-family:monospace;}
.rest-btn{padding:10px 20px;background:var(--accent);color:#000;border:none;border-radius:8px;font-weight:700;font-size:13px;font-family:monospace;cursor:pointer;}
.sets-area{padding:14px 16px;border-top:1px solid var(--border);}
.sets-lbl{font-size:9px;color:var(--muted);font-family:monospace;letter-spacing:0.1em;margin-bottom:10px;}
.set-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.set-n{font-size:12px;color:var(--muted);font-family:monospace;width:16px;flex-shrink:0;}
.i-kg{flex:1;background:var(--faint);border:1.5px solid var(--border);color:var(--text);padding:12px 8px;font-size:18px;font-family:monospace;font-weight:700;border-radius:8px;text-align:center;-webkit-appearance:none;}
.i-kg:focus{outline:none;border-color:var(--accent);}
.i-rp{width:68px;background:var(--faint);border:1.5px solid var(--border);color:var(--text);padding:12px 8px;font-size:18px;font-family:monospace;font-weight:700;border-radius:8px;text-align:center;-webkit-appearance:none;}
.i-rp:focus{outline:none;border-color:var(--teal);}
.i-unit{font-size:11px;color:var(--muted);flex-shrink:0;}
.del-btn{width:32px;height:44px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}
.add-set{width:100%;padding:12px;background:none;border:1.5px dashed var(--border);color:var(--muted);border-radius:8px;cursor:pointer;font-family:monospace;font-size:13px;margin-top:4px;}
.save-btn{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:10px;cursor:pointer;font-family:monospace;font-size:14px;font-weight:700;margin-top:10px;letter-spacing:0.05em;}
.save-btn:active{opacity:0.85;}
.pr-msg{display:none;padding:10px;background:rgba(232,255,71,0.08);border:1px solid rgba(232,255,71,0.2);border-radius:8px;text-align:center;font-size:13px;color:var(--accent);font-family:monospace;margin-top:8px;}
.qual-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;background:var(--faint);border-radius:8px;}
.qual-lbl{font-size:11px;color:var(--muted);font-family:monospace;flex:1;}
.qual-btns{display:flex;gap:4px;}
.q-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:monospace;}
.q-btn.sel{background:var(--purple);border-color:var(--purple);color:#000;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#080808;border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;padding:10px 4px 8px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:9px;font-family:monospace;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nav-btn.active{color:var(--accent);}
.nav-btn .ni{font-size:21px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:100;align-items:flex-end;}
.overlay.open{display:flex;}
.modal{background:#111;border-radius:20px 20px 0 0;padding:24px 20px calc(34px + env(safe-area-inset-bottom));width:100%;text-align:center;border-top:1px solid var(--border);}
.m-lbl{font-size:10px;color:var(--muted);font-family:monospace;letter-spacing:0.15em;margin-bottom:10px;}
.m-time{font-size:70px;font-weight:900;font-family:monospace;color:var(--accent);line-height:1;}
.m-bar-w{height:5px;background:var(--border);border-radius:3px;margin:18px 0;}
.m-bar{height:5px;background:var(--accent);border-radius:3px;transition:width 1s linear;}
.m-done{color:var(--green);font-size:22px;margin-top:6px;display:none;}
.m-close{width:100%;padding:14px;background:var(--faint);color:var(--muted);border:1px solid var(--border);border-radius:12px;cursor:pointer;font-family:monospace;font-size:14px;margin-top:8px;}
.week-list{padding:12px 16px;}
.w-item{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;}
.w-day{font-size:13px;font-weight:900;font-family:monospace;width:36px;flex-shrink:0;}
.w-info{flex:1;}
.w-full{font-size:16px;font-weight:700;}
.w-focus{font-size:12px;color:var(--muted);margin-top:2px;}
.w-local{font-size:10px;font-family:monospace;margin-top:4px;}
.hist-list{padding:12px 16px;}
.h-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.h-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.h-name{font-size:14px;font-weight:600;}
.h-date{font-size:10px;color:var(--muted);font-family:monospace;}
.h-sets{font-size:12px;color:var(--muted);font-family:monospace;line-height:1.8;}
.h-best{font-size:12px;color:var(--teal);font-family:monospace;margin-top:3px;}
.h-qual{font-size:11px;color:var(--purple);font-family:monospace;margin-top:2px;}
.review-screen{padding:16px;}
.review-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.review-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;}
.review-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.review-item:last-child{border-bottom:none;}
.review-label{font-size:12px;color:var(--muted);}
.review-val{font-size:12px;color:var(--accent);font-family:monospace;font-weight:700;}
.review-textarea{width:100%;background:var(--faint);border:1px solid var(--border);color:var(--text);padding:12px;font-size:13px;border-radius:8px;margin-top:8px;min-height:80px;font-family:-apple-system,system-ui,sans-serif;resize:none;}
.review-textarea:focus{outline:none;border-color:var(--accent);}
.review-save{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:10px;cursor:pointer;font-family:monospace;font-size:14px;font-weight:700;margin-top:12px;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty .ei{font-size:44px;margin-bottom:10px;}
.section-sep{height:1px;background:var(--border);margin:20px 0 4px;}
.load-box{padding:14px 16px;background:#090909;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.load-box-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.load-lbl{font-size:9px;color:var(--muted);font-family:monospace;letter-spacing:0.12em;margin-bottom:4px;}
.load-rm-row{display:flex;align-items:center;gap:8px;}
.rm-input{width:72px;background:var(--faint);border:1.5px solid var(--border);color:var(--text);padding:8px 8px;font-size:15px;font-family:monospace;font-weight:700;border-radius:8px;text-align:center;-webkit-appearance:none;}
.rm-input:focus{outline:none;border-color:var(--teal);}
.rm-save{padding:8px 14px;background:var(--teal);color:#000;border:none;border-radius:8px;font-family:monospace;font-size:12px;font-weight:700;cursor:pointer;}
.week-selector{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#0d0d0d;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.week-selector::-webkit-scrollbar{display:none;}
.week-lbl{font-size:9px;color:var(--muted);font-family:monospace;white-space:nowrap;letter-spacing:0.1em;flex-shrink:0;}
.wk-btn{flex-shrink:0;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--faint);color:var(--muted);font-size:10px;font-family:monospace;cursor:pointer;white-space:nowrap;}
.time-bar{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;background:var(--bg);border-bottom:1px solid var(--border);}
.time-start{font-size:14px;font-weight:700;color:var(--accent);font-family:monospace;}
.time-end{font-size:11px;color:var(--muted);font-family:monospace;margin-top:1px;}
.time-total{font-size:12px;color:var(--teal);font-family:monospace;font-weight:700;background:rgba(61,232,208,0.08);padding:4px 10px;border-radius:6px;border:1px solid rgba(61,232,208,0.2);}
.ex-time{font-size:10px;color:#444;font-family:monospace;margin-top:2px;}

/* ── SKILLS ── */
.skills-wrap{padding:12px 16px 20px;}
.skill-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.skill-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.skill-name{font-size:18px;font-weight:900;color:var(--text);letter-spacing:0.02em;}
.skill-phase-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:6px;font-family:monospace;}
.skill-desc{font-size:11px;color:var(--muted);font-family:monospace;margin-bottom:10px;}
.skill-bar-wrap{height:4px;background:var(--border);border-radius:2px;margin-bottom:6px;}
.skill-bar{height:4px;border-radius:2px;transition:width 0.5s ease;}
.skill-pct-row{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-family:monospace;margin-bottom:10px;}
.skill-phases{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.sp{font-size:10px;padding:4px 8px;border-radius:5px;font-family:monospace;border:1px solid var(--border);color:var(--muted);background:var(--faint);}
.sp.done{font-weight:700;color:#000;}
.sp.cur{font-weight:700;border-width:1.5px;}
.skill-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.si-lbl{font-size:9px;color:var(--muted);font-family:monospace;letter-spacing:0.08em;margin-bottom:4px;}
.si-inp{width:100%;background:var(--faint);border:1.5px solid var(--border);color:var(--text);padding:10px 8px;font-size:18px;font-family:monospace;font-weight:700;border-radius:8px;text-align:center;-webkit-appearance:none;}
.si-inp:focus{outline:none;border-color:var(--accent);}
.si-sel{width:100%;background:var(--faint);border:1.5px solid var(--border);color:var(--text);padding:10px 8px;font-size:13px;font-family:monospace;border-radius:8px;-webkit-appearance:none;appearance:none;}
.si-sel:focus{outline:none;border-color:var(--accent);}
.skill-save{width:100%;padding:12px;border:none;border-radius:9px;cursor:pointer;font-family:monospace;font-size:13px;font-weight:700;color:#000;}
.skill-hist{font-size:11px;color:var(--muted);font-family:monospace;margin-top:6px;text-align:center;}

/* ── CALENDAR ── */
.cal-wrap{padding:12px 16px 20px;}
.cal-streak-row{display:flex;gap:10px;margin-bottom:14px;}
.cal-streak-card{flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center;}
.csc-num{font-size:32px;font-weight:900;color:var(--accent);line-height:1;font-family:monospace;}
.csc-lbl{font-size:9px;color:var(--muted);font-family:monospace;margin-top:3px;letter-spacing:0.08em;}
.cal-month-lbl{font-size:18px;font-weight:900;margin-bottom:10px;letter-spacing:0.02em;}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.cal-nav-btn{background:var(--faint);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:7px;font-size:18px;cursor:pointer;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow{font-size:9px;color:var(--muted);font-family:monospace;text-align:center;padding:4px 0;}
.cal-day{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-family:monospace;color:var(--muted);background:var(--card);border:1px solid var(--border);cursor:pointer;}
.cal-day.today{border-color:var(--accent);color:var(--accent);font-weight:700;}
.cal-day.done{background:var(--accent);color:#000;font-weight:700;border-color:var(--accent);}
.cal-day.partial{background:rgba(232,255,71,0.15);border-color:rgba(232,255,71,0.35);color:var(--accent);}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default;}
.cal-legend{display:flex;gap:12px;margin-top:10px;font-size:10px;color:var(--muted);font-family:monospace;}

/* ── CHARTS ── */
.charts-wrap{padding:12px 16px 20px;}
.chart-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.chart-title{font-size:16px;font-weight:900;color:var(--text);margin-bottom:2px;}
.chart-meta{font-size:10px;color:var(--muted);font-family:monospace;margin-bottom:12px;}
.chart-bars{height:100px;display:flex;align-items:flex-end;gap:4px;margin-bottom:4px;}
.cb{flex:1;border-radius:3px 3px 0 0;min-height:4px;position:relative;cursor:default;}
.cb-tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;font-size:8px;font-family:monospace;font-weight:700;padding:2px 4px;border-radius:3px;white-space:nowrap;margin-bottom:2px;display:none;}
.cb:hover .cb-tip,.cb:active .cb-tip{display:block;}
.chart-lbls{display:flex;gap:4px;margin-bottom:8px;}
.cl{flex:1;text-align:center;font-size:8px;color:var(--muted);font-family:monospace;}
.chart-stats{display:flex;gap:12px;flex-wrap:wrap;}
.cs{font-size:11px;font-family:monospace;color:var(--muted);}
.cs b{color:var(--accent);}
.no-data{text-align:center;padding:24px;color:var(--muted);font-size:12px;font-family:monospace;}

.serie-block{background:var(--faint);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;}
.serie-hdr{font-size:11px;font-weight:700;color:var(--accent);font-family:monospace;letter-spacing:0.1em;margin-bottom:8px;}
.serie-inputs{display:flex;gap:8px;margin-bottom:10px;align-items:flex-end;}
.serie-kg{width:72px;background:var(--bg);border:1.5px solid var(--border);color:var(--text);padding:8px;font-size:16px;font-family:monospace;font-weight:700;border-radius:8px;text-align:center;-webkit-appearance:none;}
.serie-reps{width:60px;background:var(--bg);border:1.5px solid var(--border);color:var(--text);padding:8px;font-size:16px;font-family:monospace;font-weight:700;border-radius:8px;text-align:center;-webkit-appearance:none;}
.serie-kg:focus,.serie-reps:focus{outline:none;border-color:var(--accent);}
.serie-inp-lbl{font-size:9px;color:var(--muted);font-family:monospace;margin-bottom:3px;}
.serie-ratings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px;}
.sr-block{background:var(--bg);border-radius:8px;padding:8px;}
.sr-lbl{font-size:9px;color:var(--muted);font-family:monospace;letter-spacing:0.08em;margin-bottom:4px;}
.sr-btns{display:flex;gap:2px;flex-wrap:wrap;}
.sr-btn{width:24px;height:24px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;font-family:monospace;padding:0;}
.sr-btn.sq{background:var(--purple);border-color:var(--purple);color:#000;}
.sr-btn.sd{background:#fb923c;border-color:#fb923c;color:#000;}
.sr-btn.ss{background:#f87171;border-color:#f87171;color:#000;}
.serie-note{width:100%;background:var(--faint);border:1px solid var(--border);color:var(--text);padding:8px 10px;font-size:12px;border-radius:8px;resize:none;min-height:40px;margin-bottom:6px;font-family:-apple-system,system-ui,sans-serif;}
.serie-save{width:100%;padding:9px;background:var(--faint);border:1.5px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-family:monospace;font-size:12px;font-weight:700;}
.serie-save:active{background:var(--accent);color:#000;border-color:var(--accent);}
.serie-feedback{margin-top:8px;padding:10px 12px;border-radius:8px;font-size:12px;font-family:monospace;font-weight:700;display:none;line-height:1.4;}
.sf-up{background:rgba(74,222,128,0.15);border:1px solid #4ade80;color:#4ade80;}
.sf-keep{background:rgba(232,255,71,0.1);border:1px solid var(--accent);color:var(--accent);}
.sf-down{background:rgba(248,113,113,0.15);border:1px solid #f87171;color:#f87171;}
.sf-tech{background:rgba(167,139,250,0.15);border:1px solid var(--purple);color:var(--purple);}
.serie-done .serie-hdr{opacity:0.5;}
.serie-done .serie-hdr::after{content:" ✓";color:#4ade80;}
.add-serie-btn{width:100%;padding:10px;background:transparent;border:1.5px dashed var(--border);color:var(--muted);border-radius:8px;cursor:pointer;font-family:monospace;font-size:12px;margin-top:4px;}
</style>
</head>

  return e.reduce((b,x)=>Math.max(b,...(x.sets||[]).map(s=>parseFloat(s.w)||0)),0);
}

  const e=getH()[id]||[];

}

}

function getDur(id){ return EX_DUR[id]||null; }
function r25(n){ return Math.round(n/2.5)*2.5; }

function getRMs(){
  try{ return JSON.parse(localStorage.getItem('trv5_rm')||'{}'); }
  catch{ return {}; }
}
function saveRMs(r){
  try{ localStorage.setItem('trv5_rm', JSON.stringify(r)); }
  catch{}
}
function getRM(key){
  const saved = getRMs();
  return saved[key] || DEFAULT_RM[key] || null;
}
function getCurWeek(){
  try{ return parseInt(localStorage.getItem('trv5_week')||'1'); }
  catch{ return 1; }
}
function saveCurWeek(w){
  try{ localStorage.setItem('trv5_week', String(w)); }
  catch{}
}

function loadCalcHtml(exId){
  const rmKey = EX_RM_MAP[exId];
  if(!rmKey) return '';
  const rm = getRM(rmKey);
  const wk = Math.min(getCurWeek()-1, WEEK_SCHEMES.length-1);
  const scheme = WEEK_SCHEMES[wk];
  const load = rm ? r25(rm * scheme.pct / 100) : null;
  const rmDisplay = rm ? rm+'kg' : '—';
  const loadDisplay = load ? `<span style="font-size:22px;font-weight:900;color:var(--accent);font-family:monospace">${load}kg</span>` : `<span style="color:var(--muted);font-size:13px">configura o 1RM ↓</span>`;
  return `
    <div class="load-box">
      <div class="load-box-top">
        <div>
          <div class="load-lbl">CARGA PRESCRITA</div>
          <div style="display:flex;align-items:baseline;gap:8px">
            ${loadDisplay}
            <span style="font-size:11px;color:var(--muted);font-family:monospace">${scheme.sets}×${scheme.reps} @ ${scheme.pct}%</span>
          </div>
          <div style="font-size:10px;color:var(--muted);font-family:monospace;margin-top:3px">${scheme.label} · ${scheme.exc}</div>
        </div>
        <div style="text-align:right">
          <div class="load-lbl">1RM ATUAL</div>
          <div style="font-size:16px;font-weight:700;color:var(--teal);font-family:monospace">${rmDisplay}</div>
        </div>
      </div>
      <div class="load-rm-row">
        <span style="font-size:11px;color:var(--muted)">Atualizar 1RM:</span>
        <input type="number" inputmode="decimal" class="rm-input" id="rm-${exId}" placeholder="${rm||'—'}" value="${rm||''}">
        <span style="font-size:11px;color:var(--muted)">kg</span>
        <button class="rm-save" onclick="updateRM('${rmKey}','${exId}')">OK</button>
      </div>
    </div>`;
}

function updateRM(key, exId){
  const inp = document.getElementById('rm-'+exId);
  if(!inp||!inp.value) return;
  const rms = getRMs();
  rms[key] = parseFloat(inp.value);
  saveRMs(rms);
  // refresh the load box
  const box = document.querySelector(`#b-${exId} .load-box`);
  if(box){
    const tmp = document.createElement('div');
    tmp.innerHTML = loadCalcHtml(exId);
    box.replaceWith(tmp.firstElementChild);
  }
}

function goScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
  document.getElementById('nav-'+id).classList.add('active');
  if(id==='skills')buildSkills();
  if(id==='cal')buildCal();
  if(id==='charts')buildCharts();
  if(id==='review')buildReview();
}

// ── TODAY ─────────────────────────────────────
function todayIdx(){return{1:0,2:1,3:2,4:3,5:4,6:5,0:6}[new Date().getDay()];}

function buildStrip(){
  document.getElementById('day-strip').innerHTML=DAYS.map((d,i)=>`
    <div class="day-pill" onclick="selDay(${i})" style="border-color:${i===curDay?d.color:'var(--border)'};background:${i===curDay?d.color+'12':'var(--faint)'}">
      <div class="dp-name" style="color:${i===curDay?d.color:'var(--muted)'}">${d.name}</div>
      <div class="dp-dot" style="background:${i===curDay?d.color:'var(--border)'}"></div>
    </div>`).join('');
}

function selDay(i){
  curDay=i;openId=null;setCounts={};qualSel={};diffSel={};spineSel={};
  buildStrip();buildExList();updateHdr();
  document.querySelector('.content').scrollTop=0;
}

function updateHdr(){
  const d=DAYS[curDay];
  document.getElementById('hdr-day').textContent=d.full;
  document.getElementById('hdr-sub').textContent=d.local+' · '+d.focus;
  const b=document.getElementById('hdr-badge');
  b.textContent=d.local;
  b.style.cssText=`background:${d.color}22;color:${d.color};border:1.5px solid ${d.color}44;`;
  document.getElementById('proto-banner').innerHTML=d.proto;
  // Time bar
  const tb=document.getElementById('time-bar');
  if(d.start){
    tb.innerHTML=`
      <div><div class="time-start">⏰ ${d.start}</div><div class="time-end">término ~${d.end}</div></div>
      <div class="time-total">⏱ ${d.duration}</div>`;
    tb.style.display='flex';
  } else {
    tb.style.display='none';
  }
}

function buildExList(){
  const d=DAYS[curDay];
  document.getElementById('ex-list').innerHTML=d.blocks.map(bl=>`
    <div class="block-hdr" style="color:${d.color}">${bl.t}</div>
    ${bl.ex.map(ex=>exCard(ex)).join('')}
  `).join('');
}

function buildWeekSelector(){
  const cur = getCurWeek();
  document.getElementById('week-selector').innerHTML =
    `<div class="week-lbl">SEMANA DO CICLO:</div>` +
    WEEK_SCHEMES.map((s,i)=>
      `<button class="wk-btn${cur===i+1?' active':''}" onclick="setWeek(${i+1})">${i+1}</button>`
    ).join('') +
    `<div style="font-size:10px;color:var(--muted);font-family:monospace;white-space:nowrap;margin-left:4px">${WEEK_SCHEMES[Math.min(cur-1,4)].label.split('—')[1]?.trim()||''}</div>`;
}

function setWeek(w){
  saveCurWeek(w);
  buildWeekSelector();
  buildExList(); // refresh load calculations
}

function getDiff(id){return EX_DIFF[id]||null;}
function diffBadge(id){
  const d=getDiff(id);
  if(!d)return '';
  return `<span class="ex-diff" style="background:${DIFF_COLORS[d]}22;color:${DIFF_COLORS[d]};border:1px solid ${DIFF_COLORS[d]}44">${DIFF_LABELS[d]}</span>`;
}
function getExType(id){ return EX_TYPE[id]||'load'; }
function getExBest(id){
  const type=getExType(id);
  const entries=getH()[id]||[];
  if(!entries.length)return null;
  const last=entries[entries.length-1];
  if(type==='load') return Math.max(...entries.map(e=>Math.max(...(e.sets||[]).map(s=>parseFloat(s.w)||0),0)),0)||null;
  if(['hold','time','dist','reps'].includes(type)) return last.val||null;
  return null;
}
function logExTyped(id,val,qual,percDiff,spine){
  const h=getH();
  if(!h[id])h[id]=[];
  const type=getExType(id);
  const entry={date:new Date().toISOString(),qual,percDiff,spine};
  if(type==='load') entry.sets=val;
  else entry.val=val;
  h[id].push(entry);
  setH(h);
}
function getLastSpine(id){const e=getH()[id]||[];if(!e.length)return null;return e[e.length-1].spine||null;}
function getLastPercDiff(id){const e=getH()[id]||[];if(!e.length)return null;return e[e.length-1].percDiff||null;}

function getApneiaProtocol(ciclos){
  const wk=getCurWeek();
  const holds=[4,4,6,6,8,8,10,10,15,15,20,20];
  const holdSecs=holds[Math.min(wk-1,holds.length-1)];
  return `<b>PROTOCOLO — ${ciclos} ciclo${ciclos>1?'s':''}:</b><br><br>`+
    `<b>1.</b> Deita no chão de costas. Olhos fechados. Relaxa completamente.<br>`+
    `<b>2. INSPIRA</b> pelo nariz — <b>4 segundos.</b> Enche abdômen → costelas → peito.<br>`+
    `<b>3. SEGURA cheio</b> — <b>4 segundos.</b> Sem tensão, só segura.<br>`+
    `<b>4. EXPIRA</b> pelo nariz — <b>8 segundos.</b> Esvazia peito → costelas → abdômen.<br>`+
    `<b>5. SEGURA vazio</b> — <b>${holdSecs} segundos</b> <span style="color:var(--accent)">(Semana ${wk} do ciclo)</span>.<br>`+
    `<br><b>Repete ${ciclos}×. Total: ~${Math.round(ciclos*(4+4+8+holdSecs)/60)} minutos.</b><br>`+
    `<br><b>Progressão do hold expiratório:</b><br>`+
    holds.filter((v,i)=>i%2===0).map((v,i)=>`Sem ${i*2+1}–${i*2+2}: <b>${v}s</b>`).join(' · ')+`<br>`+
    `<br><b>Pronto para progredir quando:</b> completa todos os ciclos sem desconforto, sem querer respirar antes do hold acabar.<br>`+
    `<b>Para imediatamente se:</b> sentir tontura, formigamento ou ansiedade — reduz o hold.`;
}

function exCard(ex){
  const type=getExType(ex.id);
  const best=getExBest(ex.id);
  const lastQ=getLastQual(ex.id);
  const rFmt=ex.rest>=60?`${Math.floor(ex.rest/60)}min${ex.rest%60?' '+ex.rest%60+'s':''}`:ex.rest>0?`${ex.rest}s`:'';
  const hasLoad=!!EX_RM_MAP[ex.id];
  const dur=getDur(ex.id);

  // best display varies by type
  const configs={load:'kg',hold:'s',time:'min',dist:'m',reps:'reps'};
  const unit=configs[type]||'';
  const bestLine=best&&type!=='check'?`<div class="ex-best">↑ Melhor: ${best}${unit}</div>`:'';
  const loadLine=hasLoad&&getRM(EX_RM_MAP[ex.id])?(()=>{const wk=Math.min(getCurWeek()-1,WEEK_SCHEMES.length-1);const s=WEEK_SCHEMES[wk];const load=r25(getRM(EX_RM_MAP[ex.id])*s.pct/100);return`<div style="font-size:11px;color:var(--orange);font-family:monospace;margin-top:2px">→ ${load}kg esta semana</div>`;})():'';

  return`<div class="ex-card" id="c-${ex.id}">
  <div class="ex-row" onclick="togEx('${ex.id}')">
    <div class="ex-tick" id="tk-${ex.id}" onclick="event.stopPropagation();markDone('${ex.id}')"></div>
    <div class="ex-mid">
      <div class="ex-name">${ex.name}${tg(ex.tag||'')}${diffBadge(ex.id)}</div>
      <div class="ex-meta">${ex.sets}${rFmt?' · ⏱ '+rFmt:''}${dur?' · <span style="color:#555;font-size:10px">~'+dur+'</span>':''}</div>
      ${bestLine}${loadLine}
      ${lastQ?`<div class="ex-qual">Técnica anterior: ${lastQ}/10</div>`:''}
      ${(()=>{const s=getLastSpine(ex.id);const d=getLastPercDiff(ex.id);const parts=[];if(s!==null)parts.push(`<span style="color:#f87171">Coluna anterior: ${s}/10</span>`);if(d!==null)parts.push(`<span style="color:#fb923c">Dificuldade anterior: ${d}/10</span>`);return parts.length?`<div style="font-size:11px;font-family:monospace;margin-top:2px">${parts.join(' · ')}</div>`:'';})()}
    </div>
    <div class="ex-chev">▾</div>
  </div>
  <div class="ex-body" id="b-${ex.id}">
    <div class="howto"><div class="howto-lbl">COMO FAZER</div><div class="howto-txt">${ex.id.startsWith('apneia')?getApneiaProtocol(ex.id==='apneia-dom'?8:ex.id==='apneia-qua'?6:5):ex.how}</div></div>
    ${ex.rest>0?`<div class="rest-row"><div class="rest-info"><div class="rest-lbl">DESCANSO</div><div class="rest-val">${rFmt}</div></div><button class="rest-btn" onclick="startRest(${ex.rest})">INICIAR ▶</button></div>`:''}
    <div class="sets-area">
      ${hasLoad?loadCalcHtml(ex.id):''}
      ${buildSeriesArea(ex.id, ex.sets)}
      <div class="pr-msg" id="pr-${ex.id}">🏆 NOVO RECORDE!</div>
    </div>
  </div>
</div>`;
}

function togEx(id){
  const c=document.getElementById('c-'+id);
  const b=document.getElementById('b-'+id);
  const isOpen=c.classList.contains('open');
  if(openId&&openId!==id){
    const oc=document.getElementById('c-'+openId);
    const ob=document.getElementById('b-'+openId);
    if(oc)oc.classList.remove('open');
    if(ob)ob.style.display='none';
  }
  c.classList.toggle('open',!isOpen);
  b.style.display=isOpen?'none':'block';
  openId=isOpen?null:id;

function addRow(id){
  if(!setCounts[id])setCounts[id]=0;
  setCounts[id]++;
  const n=setCounts[id]+1;
  const div=document.createElement('div');
  div.className='set-row';
  div.innerHTML=`<div class="set-n">${n}</div>
    <input type="number" inputmode="decimal" class="i-kg" placeholder="kg" id="w-${id}-${setCounts[id]}">
    <span class="i-unit">kg</span>

  document.getElementById('rows-'+id).appendChild(div);

function saveEx(id){
  const type=getExType(id);
  const prev=getExBest(id);

  if(type==='load'){
    const count=(setCounts[id]||0)+1;
    const sets=[];
    for(let i=0;i<count+10;i++){
      const w=document.getElementById('w-'+id+'-'+i);
      const r=document.getElementById('r-'+id+'-'+i);
      if(!w)continue;
      if(w.value||r.value)sets.push({w:w.value||'0',r:r.value||'0'});
    }
    if(!sets.length&&!qualSel[id])return;
    logExTyped(id,sets,qualSel[id]||null,diffSel[id]||null,spineSel[id]??null);
  } else {
    const valEl=document.getElementById('val-'+id);
    const val=valEl?parseFloat(valEl.value)||null:null;
    if(!val&&!qualSel[id])return;
    logExTyped(id,val,qualSel[id]||null,diffSel[id]||null,spineSel[id]??null);
    if(valEl)valEl.value='';
  }

  const next=getExBest(id);
  if(next&&(!prev||next>prev)){
    const pr=document.getElementById('pr-'+id);
    if(pr){pr.style.display='block';setTimeout(()=>pr.style.display='none',2500);}
  }
  markDone(id);
  // clear selections
  delete qualSel[id]; delete diffSel[id]; delete spineSel[id];

  if(next){
    const configs={load:'kg',hold:'s',time:'min',dist:'m',reps:'reps'};
    const unit=configs[type]||'';
    const el=document.querySelector(`#c-${id} .ex-best`);
    if(el)el.textContent=`↑ Melhor: ${next}${unit}`;
    else{const mid=document.querySelector(`#c-${id} .ex-mid`);if(mid){const d=document.createElement('div');d.className='ex-best';d.textContent=`↑ Melhor: ${next}${unit}`;mid.appendChild(d);}}
  }
  if(qualSel[id]){
    const el=document.querySelector(`#c-${id} .ex-qual`);
    if(el)el.textContent='Técnica anterior: '+qualSel[id]+'/10';
    else{const mid=document.querySelector(`#c-${id} .ex-mid`);if(mid){const d=document.createElement('div');d.className='ex-qual';d.textContent='Técnica anterior: '+qualSel[id]+'/10';mid.appendChild(d);}}
  }
}

function markDone(id){
  const c=document.getElementById('c-'+id);
  const t=document.getElementById('tk-'+id);
  const done=c.classList.toggle('done');
  t.textContent=done?'✓':'';
}

  updRest();

    updRest();
  },1000);
}
function updRest(){

// ── CALENDAR ──────────────────────────────────
const MNTHS=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const DOWS=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
let calYear=new Date().getFullYear(), calMonth=new Date().getMonth();

function getCal(){try{return JSON.parse(localStorage.getItem('trv5_cal')||'{}')}catch{return{}}}
function setCal(d){try{localStorage.setItem('trv5_cal',JSON.stringify(d))}catch{}}
function calKey(y,m,d){return`${y}-${m}-${d}`;}

function buildCal(){
  const cal=getCal();
  const now=new Date();
  const today=calKey(now.getFullYear(),now.getMonth(),now.getDate());

  // streak
  let streak=0;
  const d=new Date(now);d.setHours(0,0,0,0);
  for(let i=0;i<90;i++){
    const k=calKey(d.getFullYear(),d.getMonth(),d.getDate());
    if(cal[k]==='done'){streak++;d.setDate(d.getDate()-1);}
    else if(d.getDay()===0){d.setDate(d.getDate()-1);}// skip sundays
    else break;
  }

  // week done
  const weekStart=new Date(now);weekStart.setDate(now.getDate()-now.getDay());
  let weekDone=0,weekTotal=0;
  for(let i=0;i<7;i++){const wd=new Date(weekStart);wd.setDate(weekStart.getDate()+i);if(wd.getDay()!==0)weekTotal++;const wk=calKey(wd.getFullYear(),wd.getMonth(),wd.getDate());if(cal[wk]==='done')weekDone++;}

  // month grid
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  let grid='';
  DOWS.forEach(n=>grid+=`<div class="cal-dow">${n}</div>`);
  for(let i=0;i<firstDay;i++)grid+=`<div class="cal-day empty"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const k=calKey(calYear,calMonth,day);
    const isToday=k===today;
    const st=cal[k];
    let cls='cal-day';
    if(isToday)cls+=' today';
    if(st==='done')cls+=' done';
    else if(st==='partial')cls+=' partial';
    grid+=`<div class="${cls}" onclick="toggleCal('${k}')">${day}</div>`;
  }

  // update badge
  document.getElementById('cal-streak-badge').textContent=streak+' dias 🔥';
  document.getElementById('cal-sub').textContent=`${weekDone}/${weekTotal} treinos esta semana`;

  document.getElementById('cal-wrap').innerHTML=`
    <div class="cal-streak-row">
      <div class="cal-streak-card"><div class="csc-num">${streak}</div><div class="csc-lbl">SEQUÊNCIA</div></div>
      <div class="cal-streak-card"><div class="csc-num">${weekDone}</div><div class="csc-lbl">ESTA SEMANA</div></div>
      <div class="cal-streak-card"><div class="csc-num">${Object.values(cal).filter(v=>v==='done').length}</div><div class="csc-lbl">TOTAL FEITOS</div></div>
    </div>
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
      <div class="cal-month-lbl">${MNTHS[calMonth]} ${calYear}</div>
      <button class="cal-nav-btn" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-grid">${grid}</div>
    <div class="cal-legend">
      <span style="color:var(--accent)">■ Feito</span>
      <span style="color:rgba(232,255,71,0.5)">■ Parcial</span>
      <span>■ Vazio</span>
    </div>`;
}

function toggleCal(k){
  const cal=getCal();
  const cur=cal[k];
  if(!cur)cal[k]='done';
  else if(cur==='done')cal[k]='partial';
  else delete cal[k];
  setCal(cal);buildCal();
}
function calNav(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  buildCal();
}

const CHART_EX=[
  {id:"supino",    label:"Supino",      color:"#ff6b35"},
  {id:"deadlift",  label:"Deadlift",    color:"#47ffe8"},
  {id:"agach",     label:"Agachamento", color:"#e8ff47"},
  {id:"pendlay",   label:"Pendlay Row", color:"#a78bfa"},
  {id:"ohp",       label:"OHP",         color:"#4ade80"},
  {id:"hang-clean",label:"Hang Clean",  color:"#38d9ff"},
];

function buildCharts(){
  const h=getH();
  const sk=getSk();
  let html='';

  // strength charts
  CHART_EX.forEach(ex=>{
    const entries=(h[ex.id]||[]).map(e=>({
      date:new Date(e.date),
      best:Math.max(...(e.sets||[]).map(s=>parseFloat(s.w)||0),0)
    })).filter(e=>e.best>0).slice(-12);

    if(!entries.length){
      html+=`<div class="chart-card"><div class="chart-title">${ex.label}</div><div class="no-data">Sem dados — registra séries no treino.</div></div>`;
      return;
    }
    const maxV=Math.max(...entries.map(e=>e.best));
    const pr=entries.reduce((b,e)=>e.best>b.best?e:b,entries[0]);
    const trend=entries.length>1?entries[entries.length-1].best-entries[0].best:0;

    const bars=entries.map((e,i)=>{
      const h=Math.max(5,Math.round((e.best/maxV)*96));
      const isCur=i===entries.length-1;
      const isPR=e.best===maxV;
      return`<div class="cb" style="height:${h}%;background:${isPR?ex.color:isCur?ex.color+'aa':ex.color+'44'}">
        <div class="cb-tip">${e.best}kg</div>
      </div>`;
    }).join('');
    const lbls=entries.map(e=>`<div class="cl">${e.date.getDate()}/${e.date.getMonth()+1}</div>`).join('');

    html+=`<div class="chart-card">
      <div class="chart-title">${ex.label}</div>
      <div class="chart-meta">PR: ${pr.best}kg · Tendência: ${trend>=0?'+':''}${trend.toFixed(1)}kg</div>
      <div class="chart-bars">${bars}</div>
      <div class="chart-lbls">${lbls}</div>
      <div class="chart-stats">
        <div class="cs">Atual: <b>${entries[entries.length-1].best}kg</b></div>
        <div class="cs">PR: <b>${pr.best}kg</b></div>
        <div class="cs">Sessões: <b>${entries.length}</b></div>
      </div>
    </div>`;
  });

  // skill hold charts
  SKILLS_DEF.forEach(s=>{
    const hist=(sk[s.id+'_hist']||[]).slice(-10);
    if(hist.length<2)return;
    const maxV=Math.max(...hist.map(h=>h.v));
    const bars=hist.map((h,i)=>{
      const ht=Math.max(5,Math.round((h.v/maxV)*96));
      const isCur=i===hist.length-1;
      return`<div class="cb" style="height:${ht}%;background:${isCur?s.color:s.color+'55'}">
        <div class="cb-tip">${h.v}s</div>
      </div>`;
    }).join('');
    const lbls=hist.map(h=>`<div class="cl">${new Date(h.date).getDate()}/${new Date(h.date).getMonth()+1}</div>`).join('');
    const trend=hist[hist.length-1].v-hist[0].v;
    html+=`<div class="chart-card">
      <div class="chart-title">${s.name} — Hold</div>
      <div class="chart-meta">Evolução em segundos · ${trend>=0?'+':''}${trend}s total</div>
      <div class="chart-bars">${bars}</div>
      <div class="chart-lbls">${lbls}</div>
      <div class="chart-stats">
        <div class="cs">Atual: <b>${hist[hist.length-1].v}s</b></div>
        <div class="cs">Máx: <b>${maxV}s</b></div>
      </div>
    </div>`;
  });

  document.getElementById('charts-wrap').innerHTML=html||`<div class="no-data" style="padding:60px 20px">Nenhum dado ainda.<br>Registra treinos e salva skills primeiro.</div>`;
}

function buildReview(){
  const reviews=getReviews();
  const last=reviews[reviews.length-1];

  const h=getH();
  // calc week stats
  const exMap={};
  DAYS.forEach(d=>d.blocks.forEach(b=>b.ex.forEach(e=>exMap[e.id]=e.name)));
  const oneWeekAgo=new Date();oneWeekAgo.setDate(oneWeekAgo.getDate()-7);
  const weekEntries=[];
  Object.entries(h).forEach(([id,entries])=>{
    entries.filter(e=>new Date(e.date)>oneWeekAgo).forEach(e=>weekEntries.push({id,...e}));
  });
  const prs=weekEntries.filter(e=>{
    const all=h[e.id]||[];
    const idx=all.indexOf(e);
    const prevBest=idx>0?Math.max(...all.slice(0,idx).map(x=>Math.max(...(x.sets||[]).map(s=>parseFloat(s.w)||0),0)),0):0;

    return thisBest>prevBest&&thisBest>0;
  });
  const avgQual=weekEntries.filter(e=>e.qual).length?
    (weekEntries.filter(e=>e.qual).reduce((s,e)=>s+e.qual,0)/weekEntries.filter(e=>e.qual).length).toFixed(1):
    '—';
  el.innerHTML=`
    <div class="review-card">
      <div class="review-title">📊 Esta Semana</div>
      <div class="review-item"><span class="review-label">Exercícios registrados</span><span class="review-val">${weekEntries.length}</span></div>

      <div class="review-item"><span class="review-label">Qualidade técnica média</span><span class="review-val">${avgQual}/10</span></div>
    </div>
    <div class="review-card">
      <div class="review-title">✅ Revisão Semanal</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Preenche todo domingo. 10 minutos que fazem a diferença.</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:4px">1. O que progrediu esta semana?</div>
      <textarea class="review-textarea" id="r1" placeholder="Força, skills, mobilidade..."></textarea>
      <div style="font-size:12px;color:var(--muted);margin:10px 0 4px">2. O que estancou ou regrediu?</div>
      <textarea class="review-textarea" id="r2" placeholder="O que não evoluiu como esperado..."></textarea>
      <div style="font-size:12px;color:var(--muted);margin:10px 0 4px">3. Algo doeu ou ficou desconfortável?</div>
      <textarea class="review-textarea" id="r3" placeholder="Dores, desconfortos, lesões menores..."></textarea>
      <div style="font-size:12px;color:var(--muted);margin:10px 0 4px">4. HRV médio da semana (se mediu)</div>
      <input type="number" class="review-textarea" id="r4" placeholder="Ex: 72" style="min-height:auto;padding:10px;">
      <div style="font-size:12px;color:var(--muted);margin:10px 0 4px">5. Qualidade do sono (média 1–10)</div>
      <input type="number" class="review-textarea" id="r5" placeholder="Ex: 7.5" style="min-height:auto;padding:10px;">
      <div style="font-size:12px;color:var(--muted);margin:10px 0 4px">6. O que ajustar na próxima semana?</div>
      <textarea class="review-textarea" id="r6" placeholder="Volume, exercícios, protocolos..."></textarea>
      <button class="review-save" onclick="submitReview()">SALVAR REVISÃO ✓</button>
    </div>
    ${reviews.length>0?`
    <div class="review-card">
      <div class="review-title">📅 Revisões Anteriores</div>
      ${reviews.slice().reverse().slice(0,4).map(r=>`
        <div style="border-bottom:1px solid var(--border);padding:10px 0;">
          <div style="font-size:10px;color:var(--muted);font-family:monospace;margin-bottom:6px">${new Date(r.date).toLocaleDateString('pt-BR')}</div>
          ${r.r1?`<div style="font-size:12px;color:var(--green);margin-bottom:3px">✓ ${r.r1.substring(0,80)}${r.r1.length>80?'...':''}</div>`:''}
          ${r.r3?`<div style="font-size:12px;color:var(--orange);margin-bottom:3px">⚠ ${r.r3.substring(0,80)}${r.r3.length>80?'...':''}</div>`:''}
        </div>
      `).join('')}
    </div>`:''}
  `;
}

function submitReview(){
  const r={
    date:new Date().toISOString(),
    r1:document.getElementById('r1').value,
    r2:document.getElementById('r2').value,
    r3:document.getElementById('r3').value,
    r4:document.getElementById('r4').value,
    r5:document.getElementById('r5').value,
    r6:document.getElementById('r6').value,
  };
  saveReview(r);
  buildReview();
  alert('Revisão salva ✓');
}


// ── SERIES POR EXERCICIO ─────────────────────────────────
const serieData = {};
const serieState = {};
const DIFF_TARGET = [6, 7, 7.5, 8.5, 5];

function getDiffTarget() {
  return DIFF_TARGET[Math.min(getCurWeek()-1, 4)];
}

function roundTo25(val) {
  return Math.round(val / 2.5) * 2.5;
}

function calcSuggestion(kg, qual, diff) {
  if (diff === null || diff === undefined) return null;
  var w = parseFloat(kg) || 0;
  var target = getDiffTarget();
  var wkNames = ['Hipertrofia','Forca-Hiper','Forca','Forca Max','Deload'];
  var wkName = wkNames[Math.min(getCurWeek()-1, 4)];
  var zone = '(alvo sem.' + getCurWeek() + ' \u2014 ' + wkName + ': ' + target + '/10)';

  if (qual !== null && qual !== undefined && qual <= 5) {
    if (w > 0) {
      var red = Math.max(roundTo25(w * 0.05), 2.5);
      return {type:'tech', msg:'Reduz ' + red + 'kg \u2014 tecnica precisa melhorar antes de progredir'};
    }
    return {type:'tech', msg:'Reduz o peso \u2014 foca na tecnica primeiro'};
  }
  if (qual !== null && qual !== undefined && qual === 6) {
    return {type:'tech', msg:'Mantem o peso \u2014 melhora a tecnica antes de subir'};
  }

  var gap = diff - target;
  var pct;
  if (gap <= -4)      pct = 0.10;
  else if (gap <= -2) pct = 0.06;
  else if (gap <= -1) pct = 0.03;
  else if (gap <= 1)  pct = 0;
  else if (gap <= 2)  pct = -0.03;
  else if (gap <= 3)  pct = -0.06;
  else                pct = -0.10;

  if (pct === 0) {
    var msg = w > 0 ? 'Mantem ' + w + 'kg \u2014 dificuldade ideal ' + zone : 'Dificuldade ideal ' + zone;
    return {type:'keep', msg: msg};
  }
  if (w <= 0) {
    var pctStr = Math.round(Math.abs(pct)*100) + '%';
    return {type: pct>0?'up':'down', msg: (pct>0?'Aumenta':'Reduz') + ' ~' + pctStr + ' ' + zone + ' \u2014 digite o kg para valor exato'};
  }
  var delta = roundTo25(Math.abs(w * pct));
  var safeMin = w <= 10 ? 0.5 : w <= 20 ? 1.25 : 2.5;
  var finalDelta = Math.max(delta, safeMin);
  var newW = roundTo25(w + (pct > 0 ? finalDelta : -finalDelta));
  if (pct > 0) return {type:'up', msg:'Aumenta para ' + newW + 'kg (+' + finalDelta + 'kg) na proxima sessao ' + zone};
  else return {type:'down', msg:'Reduz para ' + newW + 'kg (-' + finalDelta + 'kg) na proxima sessao ' + zone};
}

function showFeedback(id, sIdx, suggestion) {
  var fb = document.getElementById('sfb-' + id + '-' + sIdx);
  if (!fb) return;
  if (!suggestion) { fb.style.display = 'none'; return; }
  fb.style.display = 'block';
  fb.className = 'serie-feedback sf-' + suggestion.type;
  fb.textContent = suggestion.msg;
}

function selSR(id, sIdx, type, val) {
  var key = id + '_' + sIdx;
  if (!serieState[key]) serieState[key] = {qual:null, diff:null, spine:null};
  serieState[key][type] = val;
  var pfx = type==='qual' ? 'sq' : type==='diff' ? 'sd' : 'ss';
  var max = type==='spine' ? 10 : 10;
  var start = type==='spine' ? 0 : 1;
  for (var i = start; i <= max; i++) {
    var b = document.getElementById(pfx + '-' + id + '-' + sIdx + '-' + i);
    if (b) b.className = 'sr-btn' + (i === val ? ' ' + pfx : '');
  }
  var kgEl = document.getElementById('skg-' + id + '-' + sIdx);
  var kg = kgEl ? kgEl.value : '0';
  var s = serieState[key];
  if (s.diff !== null) showFeedback(id, sIdx, calcSuggestion(kg, s.qual, s.diff));
}

function saveSerie(id, sIdx) {
  var key = id + '_' + sIdx;
  var st = serieState[key] || {};
  var kgEl = document.getElementById('skg-' + id + '-' + sIdx);
  var rpEl = document.getElementById('srp-' + id + '-' + sIdx);
  var ntEl = document.getElementById('snt-' + id + '-' + sIdx);
  if (!serieData[id]) serieData[id] = [];
  while (serieData[id].length <= sIdx) serieData[id].push({});
  serieData[id][sIdx] = {
    kg: kgEl ? kgEl.value : '',
    reps: rpEl ? rpEl.value : '',
    qual: st.qual || null,
    diff: st.diff || null,
    spine: st.spine != null ? st.spine : null,
    notes: ntEl ? ntEl.value.trim() : '',
    saved: true,
    date: new Date().toISOString()
  };
  var h = getH();
  if (!h[id]) h[id] = [];
  h[id].push({
    date: new Date().toISOString(),
    sets: serieData[id].filter(function(s){return s.saved;}).map(function(s){return {w:s.kg,r:s.reps};}),
    qual: st.qual, percDiff: st.diff, spine: st.spine,
    notes: ntEl ? ntEl.value.trim() : ''
  });
  setH(h);
  var block = document.getElementById('sb-' + id + '-' + sIdx);
  if (block) block.classList.add('serie-done');
  var kg = kgEl ? kgEl.value : '0';
  showFeedback(id, sIdx, calcSuggestion(kg, st.qual, st.diff));
}

function addExtraSerie(id) {
  if (!serieData[id]) serieData[id] = [];
  var sIdx = serieData[id].length;
  serieData[id].push({});
  var container = document.getElementById('series-container-' + id);
  if (!container) return;
  var div = document.createElement('div');
  div.innerHTML = buildSerieBlock(id, sIdx, true);
  container.appendChild(div.firstElementChild);
}

function buildSerieBlock(id, sIdx, isExtra) {
  var label = isExtra ? 'SERIE EXTRA ' + (sIdx+1) : 'SERIE ' + (sIdx+1);
  var qBtns = '', dBtns = '', sBtns = '';
  for (var i=1; i<=10; i++) qBtns += '<button class="sr-btn" id="sq-'+id+'-'+sIdx+'-'+i+'" onclick="selSR(\''+id+'\','+sIdx+',\'qual\','+i+')">'+i+'</button>';
  for (var i=1; i<=10; i++) dBtns += '<button class="sr-btn" id="sd-'+id+'-'+sIdx+'-'+i+'" onclick="selSR(\''+id+'\','+sIdx+',\'diff\','+i+')">'+i+'</button>';
  for (var i=0; i<=10; i++) sBtns += '<button class="sr-btn" id="ss-'+id+'-'+sIdx+'-'+i+'" onclick="selSR(\''+id+'\','+sIdx+',\'spine\','+i+')">'+i+'</button>';
  return '<div class="serie-block" id="sb-'+id+'-'+sIdx+'">'
    + '<div class="serie-hdr">'+label+'</div>'
    + '<div class="serie-inputs">'
    + '<div><div class="serie-inp-lbl">KG</div><input type="number" inputmode="decimal" class="serie-kg" id="skg-'+id+'-'+sIdx+'" placeholder="0" onchange="var _s=serieState[\''+id+'_'+sIdx+'\'];if(_s&&_s.diff!=null)showFeedback(\''+id+'\','+sIdx+',calcSuggestion(this.value,_s.qual,_s.diff))"></div>'
    + '<div><div class="serie-inp-lbl">REPS</div><input type="number" inputmode="numeric" class="serie-reps" id="srp-'+id+'-'+sIdx+'" placeholder="0"></div>'
    + '</div>'
    + '<div class="serie-ratings">'
    + '<div class="sr-block"><div class="sr-lbl">TECNICA</div><div class="sr-btns">'+qBtns+'</div></div>'
    + '<div class="sr-block"><div class="sr-lbl">DIFICULDADE</div><div class="sr-btns">'+dBtns+'</div></div>'
    + '<div class="sr-block" style="background:#1a0f0f"><div class="sr-lbl" style="color:#f87171">COLUNA</div><div class="sr-btns">'+sBtns+'</div></div>'
    + '</div>'
    + '<textarea class="serie-note" id="snt-'+id+'-'+sIdx+'" placeholder="Observacao desta serie..."></textarea>'
    + '<button class="serie-save" onclick="saveSerie(\''+id+'\','+sIdx+')">SALVAR SERIE '+(sIdx+1)+' \u2713</button>'
    + '<div class="serie-feedback" id="sfb-'+id+'-'+sIdx+'"></div>'
    + '</div>';
}

function initSeries(id, prescribedSets) {
  if (!serieData[id]) {
    var m = prescribedSets.match(/(\d+)\s*[x\u00d7]/);
    var n = m ? parseInt(m[1]) : 3;
    serieData[id] = [];
    for (var i=0; i<n; i++) serieData[id].push({});
  }
  return serieData[id];
}

function buildSeriesArea(id, prescribedSets) {
  var series = initSeries(id, prescribedSets);
  var html = '<div id="series-container-'+id+'">';
  for (var i=0; i<series.length; i++) html += buildSerieBlock(id, i, false);
  html += '</div><button class="add-serie-btn" onclick="addExtraSerie(\''+id+'\')">+ Adicionar serie extra</button>';
  return html;
}
